<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIOP — Diagnóstico de Impacto Operativo · Tecno-Fab</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#060b12; --s1:#0a1220; --s2:#0f1a2e; --s3:#152038;
  --border:rgba(0,173,181,0.1); --border2:rgba(0,173,181,0.22); --border3:rgba(0,173,181,0.4);
  --text:#e8f4f5; --text2:#7ab0b8; --text3:#3a7a82; --text4:#1e4a52;
  --teal:#00adb5; --teal-l:#00dee8; --teal-d:#007c82;
  --green:#1D9E75; --green-l:#2dcf9a; --green-d:#0a6b4e;
  --amber:#BA7517; --red:#E24B4A; --purple:#7F77DD;
  --r:10px; --r-sm:6px; --r-xs:4px;
  --font:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;}

/* ── TOPBAR ── */
.topbar{height:52px;background:var(--s1);border-bottom:0.5px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;z-index:10;}
.topbar-logo{width:28px;height:28px;flex-shrink:0;}
.topbar-brand{font-size:13px;font-weight:600;color:var(--text);}
.topbar-version{font-size:10px;color:var(--text3);font-family:var(--mono);background:var(--s2);padding:2px 7px;border-radius:var(--r-xs);border:0.5px solid var(--border);}
.topbar-spacer{flex:1;}
.topbar-client{font-size:12px;color:var(--text2);font-family:var(--mono);}
.topbar-back{display:none;align-items:center;gap:6px;font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;font-family:var(--font);padding:5px 10px;border-radius:var(--r-sm);transition:all .15s;}
.topbar-back:hover{color:var(--teal-l);background:rgba(0,173,181,0.08);}
.topbar-back.visible{display:flex;}

/* ── LAYOUT ── */
.app-body{display:flex;flex:1;overflow:hidden;}
.sidebar{width:220px;background:var(--s1);border-right:0.5px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.content{flex:1;overflow-y:auto;padding:28px 32px;}

/* ── SIDEBAR ── */
.sidebar-section{padding:16px 14px 8px;}
.sidebar-label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);font-family:var(--mono);margin-bottom:8px;}
.sidebar-client-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px;line-height:1.3;}
.sidebar-client-meta{font-size:11px;color:var(--text3);}
.sidebar-divider{height:0.5px;background:var(--border);margin:8px 14px;}

/* ROADMAP IN SIDEBAR */
.rm-list{padding:8px 14px;}
.rm-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--r-sm);cursor:pointer;transition:all .15s;margin-bottom:2px;}
.rm-item:hover{background:rgba(0,173,181,0.06);}
.rm-item.rm-active{background:rgba(0,173,181,0.1);border:0.5px solid rgba(0,173,181,0.2);}
.rm-circle{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;font-family:var(--mono);flex-shrink:0;transition:all .2s;}
.rc-done{background:rgba(29,158,117,0.15);border:1px solid var(--green);color:var(--green);}
.rc-active{background:rgba(0,173,181,0.15);border:1px solid var(--teal);color:var(--teal-l);box-shadow:0 0 8px rgba(0,173,181,0.2);}
.rc-pending{background:var(--s2);border:1px solid var(--border);color:var(--text3);}
.rm-label{font-size:12px;color:var(--text2);line-height:1.3;}
.rm-label.rla{color:var(--teal-l);font-weight:500;}
.rm-label.rld{color:var(--green);}
.rc-dirty{background:rgba(186,117,23,0.15);border:1px solid var(--amber);color:var(--amber);}
.rm-label.rly{color:var(--amber);font-weight:500;}  
.rm-progress{font-size:10px;color:var(--text3);font-family:var(--mono);margin-left:auto;}

.sidebar-footer{margin-top:auto;padding:12px 14px;border-top:0.5px solid var(--border);}
.sf-text{font-size:10px;color:var(--text4);}

/* ── SCREENS ── */
.screen{display:none;}
.screen.on{display:block;}

/* ── HOME SCREEN ── */
.page-header{margin-bottom:24px;}
.page-title{font-size:20px;font-weight:600;color:var(--text);margin-bottom:4px;}
.page-sub{font-size:13px;color:var(--text2);}

.home-actions{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.home-count{font-size:12px;color:var(--text3);font-family:var(--mono);}
.new-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;background:rgba(0,173,181,0.08);border:0.5px solid var(--border2);border-radius:var(--r-sm);color:var(--teal-l);font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all .15s;}
.new-btn:hover{background:rgba(0,173,181,0.16);}

.client-grid{display:flex;flex-direction:column;gap:8px;}
.cc{background:var(--s1);border:0.5px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;transition:all .2s;}
.cc:hover{border-color:var(--border2);background:var(--s2);}
.cc-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
.cc-name{font-size:14px;font-weight:600;color:var(--text);}
.cc-sector{font-size:11px;color:var(--text3);background:var(--s2);padding:2px 8px;border-radius:var(--r-xs);border:0.5px solid var(--border);}
.cc-prog-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.prog-track{flex:1;height:3px;background:var(--s3);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--teal-d),var(--teal-l));transition:width .4s;}
.prog-pct{font-size:10px;color:var(--text3);font-family:var(--mono);white-space:nowrap;}
.cc-sessions{display:flex;gap:5px;flex-wrap:wrap;}
.cs-dot{display:flex;align-items:center;gap:4px;font-size:10px;padding:3px 8px;border-radius:var(--r-xs);border:0.5px solid transparent;}
.csd-done{background:rgba(29,158,117,0.08);border-color:rgba(29,158,117,0.2);color:var(--green);}
.csd-active{background:rgba(0,173,181,0.08);border-color:rgba(0,173,181,0.25);color:var(--teal-l);}
.csd-pending{background:var(--s2);color:var(--text3);}
.csd-icon{width:5px;height:5px;border-radius:50%;background:currentColor;}

/* ── SESSION SCREEN ── */
.session-hero{background:var(--s1);border:0.5px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:20px;display:flex;align-items:center;gap:14px;}
.sh-icon{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.shi-ceo{background:rgba(127,119,221,0.1);border:0.5px solid rgba(127,119,221,0.2);}
.shi-fab{background:rgba(0,173,181,0.1);border:0.5px solid rgba(0,173,181,0.2);}
.shi-sys{background:rgba(29,158,117,0.1);border:0.5px solid rgba(29,158,117,0.2);}
.sh-info{flex:1;}
.sh-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:2px;}
.sh-sub{font-size:12px;color:var(--text2);}
.sh-time{font-size:11px;color:var(--text3);font-family:var(--mono);background:var(--s2);padding:3px 9px;border-radius:var(--r-xs);border:0.5px solid var(--border);}

/* BLOCK PROGRESS BAR */
.block-prog{display:flex;gap:6px;margin-bottom:20px;align-items:center;}
.bp{flex:1;height:4px;border-radius:2px;background:var(--s3);transition:all .3s;position:relative;}
.bp.bp-done{background:var(--green);}
.bp.bp-done::after{content:'';position:absolute;right:-1px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--green);border:1.5px solid var(--bg);}
.bp.bp-active{background:var(--teal);}

/* BLOCK */
.q-block{margin-bottom:24px;}
.qb-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:10px 14px;background:var(--s1);border-radius:var(--r-sm);border-left:2px solid;transition:all .2s;}
.qb-header.block-complete{background:rgba(29,158,117,0.06);border-color:var(--green)!important;}
.qb-header.block-complete .qbh-name{color:var(--green);}
.qbh-ceo{border-color:var(--purple);}
.qbh-fab{border-color:var(--teal);}
.qbh-sys{border-color:var(--green);}
.qbh-name{font-size:12px;font-weight:600;color:var(--text);}
.qbh-obj{font-size:11px;color:var(--text3);margin-top:2px;}
.qbh-count{font-size:10px;color:var(--text3);font-family:var(--mono);margin-left:auto;white-space:nowrap;}

/* QUESTION CARD */
.q-card{background:var(--s1);border:0.5px solid var(--border);border-radius:var(--r-sm);margin-bottom:6px;overflow:hidden;transition:all .2s;}
.q-card.q-quant{border-left:2px solid rgba(29,158,117,0.4);}
.q-card:focus-within{border-color:var(--border2);}
.q-card.q-answered{border-color:rgba(0,173,181,0.25);background:rgba(0,173,181,0.03);}
.q-card.q-answered .q-text{color:var(--text2);}
.q-card.q-answered::after{content:'✓';position:absolute;top:10px;right:10px;font-size:10px;color:var(--teal);font-weight:600;}
.q-card{position:relative;}
.q-card.q-missing{border-color:rgba(226,75,74,0.5);background:rgba(226,75,74,0.04);animation:shake .3s ease;}
.q-card.q-missing .q-text{color:var(--text);}
.q-card.q-missing::before{content:'Pendiente';position:absolute;top:10px;right:10px;font-size:9px;color:var(--red);font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:rgba(226,75,74,0.1);padding:2px 7px;border-radius:4px;}
.q-card.q-dirty{
  border-color:rgba(186,117,23,0.5);
  background:rgba(186,117,23,0.05);
}
.q-card.q-dirty .q-text{
  color:var(--text);
}
.q-card.q-dirty::before{
  content:'Modificada';
  position:absolute;
  top:10px;
  right:10px;
  font-size:9px;
  color:var(--amber);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.06em;
  background:rgba(186,117,23,0.12);
  padding:2px 7px;
  border-radius:4px;
}
.q-card.q-missing .q-prio{outline:1px solid rgba(226,75,74,0.4);}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.missing-banner{background:rgba(226,75,74,0.08);border:0.5px solid rgba(226,75,74,0.3);border-radius:var(--r-sm);padding:10px 14px;margin-bottom:12px;display:none;align-items:center;gap:8px;}
.missing-banner.visible{display:flex;}
.mb-icon{color:var(--red);font-size:14px;flex-shrink:0;}
.mb-text{font-size:12px;color:rgba(226,75,74,0.9);line-height:1.4;}
.mb-count{font-size:11px;font-weight:600;color:var(--red);margin-left:auto;white-space:nowrap;}
.q-top{padding:10px 12px;}
.q-meta{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.q-num{font-size:9px;color:var(--text3);font-family:var(--mono);}
.q-prio{font-size:9px;padding:1px 6px;border-radius:3px;}
.qp-c{background:rgba(226,75,74,0.1);color:var(--red);}
.qp-i{background:rgba(186,117,23,0.1);color:var(--amber);}
.qp-s{background:rgba(58,122,130,0.1);color:var(--text3);}
.qp-qw{background:rgba(29,158,117,0.1);color:var(--green);}
.q-text{font-size:13px;color:var(--text);line-height:1.45;margin-bottom:10px;}
.q-roi-hint{display:flex;align-items:flex-start;gap:6px;background:rgba(29,158,117,0.06);border-radius:var(--r-xs);padding:6px 10px;margin-top:6px;}
.qrh-icon{font-size:11px;color:var(--green);flex-shrink:0;margin-top:1px;}
.qrh-text{font-size:11px;color:rgba(29,158,117,0.8);line-height:1.4;font-style:italic;}

/* INPUTS */
.yn-row{display:flex;gap:6px;}
.yn-btn{flex:1;padding:8px;border-radius:var(--r-sm);border:0.5px solid var(--border2);background:transparent;color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all .15s;}
.yn-btn:hover{border-color:var(--border3);color:var(--text);}
.yn-btn.yn-sel-y{background:rgba(29,158,117,0.1);border-color:var(--green);color:var(--green);}
.yn-btn.yn-sel-n{background:rgba(226,75,74,0.08);border-color:var(--red);color:var(--red);}

.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.opt-grid[data-type="multi"]{grid-template-columns:1fr;}
.opt-btn{padding:8px 10px;border-radius:var(--r-sm);border:0.5px solid var(--border);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;font-family:var(--font);transition:all .15s;text-align:left;line-height:1.35;}
.opt-btn:hover{border-color:var(--border2);color:var(--text);}
.opt-btn.opt-sel{background:rgba(0,173,181,0.08);border-color:var(--teal);color:var(--teal-l);}
.opt-btn.opt-multi-sel{background:rgba(0,173,181,0.06);border-color:rgba(0,173,181,0.4);color:var(--teal-l);}

.num-input{width:100%;background:var(--s2);border:0.5px solid var(--border2);border-radius:var(--r-sm);padding:9px 12px;color:var(--text);font-size:13px;font-family:var(--font);outline:none;transition:border-color .15s;}
.num-input:focus{border-color:var(--border3);}

.txt-input{width:100%;background:var(--s2);border:0.5px solid var(--border2);border-radius:var(--r-sm);padding:9px 12px;color:var(--text);font-size:13px;font-family:var(--font);outline:none;min-height:72px;resize:vertical;line-height:1.5;transition:border-color .15s;}
.txt-input:focus{border-color:var(--border3);}

/* SAVE BAR */
.save-bar{position:sticky;bottom:0;background:var(--bg);border-top:0.5px solid var(--border);padding:12px 32px;display:flex;align-items:center;justify-content:space-between;margin:-28px -32px 0;margin-top:24px;}
.sb-info{font-size:11px;color:var(--text3);font-family:var(--mono);}
.sb-actions{display:flex;gap:8px;}
.btn-save-sess{padding:9px 20px;background:rgba(0,173,181,0.1);border:0.5px solid var(--border2);border-radius:var(--r-sm);color:var(--teal-l);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all .15s;}
.btn-save-sess:hover{background:rgba(0,173,181,0.18);}
.btn-complete-sess{padding:9px 20px;background:var(--teal-d);border:0.5px solid var(--teal);border-radius:var(--r-sm);color:var(--teal-l);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all .15s;}
.btn-complete-sess:hover{background:var(--teal);}

/* ── REPORT SCREEN ── */
.report-ready{text-align:center;padding:40px 20px;}
.rr-icon{font-size:40px;margin-bottom:12px;}
.rr-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:6px;}
.rr-sub{font-size:13px;color:var(--text2);margin-bottom:24px;}
.gen-btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;background:linear-gradient(135deg,var(--teal-d),var(--teal));border:none;border-radius:var(--r-sm);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);transition:opacity .15s;}
.gen-btn:hover{opacity:.9;}
.gen-btn:disabled{opacity:.4;cursor:not-allowed;}

.report-content{max-width:720px;margin:0 auto;}
.report-header{background:var(--s1);border:0.5px solid var(--teal-d);border-radius:var(--r);overflow:hidden;margin-bottom:16px;box-shadow:0 0 24px rgba(0,173,181,0.06);}
.rh-top{background:linear-gradient(135deg,#0B1220,#0f2535);border-bottom:1px solid var(--teal-d);padding:18px 20px;display:flex;align-items:center;gap:14px;}
.rh-logo{width:36px;height:36px;flex-shrink:0;}
.rh-company{font-size:16px;font-weight:600;color:var(--text);}
.rh-meta{font-size:11px;color:var(--teal);font-family:var(--mono);margin-top:2px;}
.rh-body{padding:20px;}

.r-section{margin-bottom:20px;}
.r-section:last-child{margin-bottom:0;}
.r-label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);font-family:var(--mono);margin-bottom:8px;}
.r-summary{background:var(--s2);border-left:3px solid var(--teal);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:14px;}
.r-summary p{font-size:14px;color:var(--text);font-weight:500;line-height:1.55;}

.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.kpi-card{background:var(--s2);border-radius:var(--r-sm);padding:12px;border:0.5px solid var(--border);}
.kpi-lbl{font-size:10px;color:var(--text3);font-family:var(--mono);margin-bottom:4px;}
.kpi-val{font-size:20px;font-weight:700;}
.kv-r{color:var(--red);} .kv-a{color:var(--amber);} .kv-g{color:var(--green);} .kv-t{color:var(--teal-l);}

.qw-list{display:flex;flex-direction:column;gap:7px;}
.qw-item{display:flex;gap:10px;align-items:flex-start;}
.qw-badge{font-size:10px;padding:2px 8px;border-radius:var(--r-xs);white-space:nowrap;font-weight:500;flex-shrink:0;margin-top:1px;}
.qwb-1{background:rgba(226,75,74,0.1);color:var(--red);border:0.5px solid rgba(226,75,74,0.2);}
.qwb-2{background:rgba(186,117,23,0.1);color:var(--amber);border:0.5px solid rgba(186,117,23,0.2);}
.qwb-3{background:rgba(29,158,117,0.1);color:var(--green);border:0.5px solid rgba(29,158,117,0.2);}
.qw-text{font-size:12px;color:var(--text2);line-height:1.45;}

.roi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.roi-card{background:var(--s2);border-radius:var(--r-sm);padding:12px;border:0.5px solid var(--border);}
.roi-lbl{font-size:10px;color:var(--text3);font-family:var(--mono);margin-bottom:4px;}
.roi-val{font-size:15px;font-weight:600;}
.roi-note{font-size:10px;color:var(--text3);margin-top:8px;font-style:italic;line-height:1.4;}

.bench-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.bench-card{background:var(--s2);border-radius:var(--r-sm);padding:12px;text-align:center;}
.bench-lbl{font-size:10px;color:var(--text3);font-family:var(--mono);margin-bottom:6px;}
.bench-val{font-size:18px;font-weight:700;}

.tool-list{display:flex;flex-direction:column;gap:7px;}
.tool-item{background:var(--s2);border-radius:var(--r-sm);padding:12px;border:0.5px solid var(--border);}
.tool-item:first-child{border-color:rgba(29,158,117,0.3);border-left:2px solid var(--green);}
.tool-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.tool-name{font-size:13px;font-weight:500;color:var(--text);}
.tool-type{font-size:10px;padding:1px 7px;border-radius:var(--r-xs);background:var(--s3);color:var(--text3);}
.tool-desc{font-size:12px;color:var(--text2);margin-bottom:5px;}
.tool-foot{display:flex;align-items:center;justify-content:space-between;}
.tool-price{font-size:11px;color:var(--text3);}
.tool-link{font-size:11px;color:var(--teal);text-decoration:none;}
.tool-link:hover{color:var(--teal-l);}

.madurez-bar-wrap{margin-bottom:10px;}
.madurez-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.madurez-score{font-size:24px;font-weight:700;}
.madurez-nivel{font-size:13px;font-weight:500;}
.madurez-track{height:6px;background:var(--s3);border-radius:3px;overflow:hidden;margin-bottom:8px;}
.madurez-fill{height:100%;border-radius:3px;transition:width .5s;}
.madurez-desc{font-size:12px;color:var(--text2);}
.madurez-next{font-size:11px;color:var(--text3);font-style:italic;margin-top:4px;}

.ait-dot:nth-child(3){animation-delay:.4s;}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}

.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}

.fg{margin-bottom:14px;}
.fl{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;font-weight:500;}
.fi{width:100%;background:var(--s2);border:0.5px solid var(--border2);border-radius:var(--r-sm);padding:8px 12px;color:var(--text);font-size:13px;font-family:var(--font);outline:none;}

.btn-cancel{padding:8px 14px;border:0.5px solid var(--border2);border-radius:var(--r-sm);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;font-family:var(--font);}
.btn-create{padding:8px 18px;border:0.5px solid var(--teal);border-radius:var(--r-sm);background:rgba(0,173,181,0.1);color:var(--teal-l);font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all .15s;}

.toast.show{opacity:1;transform:translateY(0);}

/* EMPTY STATE */
.empty{text-align:center;padding:60px 20px;color:var(--text3);}
.empty p{font-size:13px;margin-bottom:16px;}

.search-input::placeholder{color:var(--text3);}

.sector-name{font-size:13px;font-weight:600;color:var(--text);}
.sector-meta{font-size:11px;color:var(--text3);margin-top:1px;}
.sector-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.sector-count{font-size:10px;color:var(--text3);background:var(--s2);padding:2px 8px;border-radius:var(--r-xs);border:0.5px solid var(--border);font-family:var(--mono);}
.sector-chevron{font-size:11px;color:var(--text3);transition:transform .2s;}
.sector-card.open .sector-chevron{transform:rotate(180deg);}
.sector-body{display:none;padding:0 12px 12px;}
.sector-card.open .sector-body{display:block;}
.sector-mini-prog{display:flex;gap:3px;flex-shrink:0;}
.smp{width:16px;height:3px;border-radius:2px;}
.smp-done{background:var(--green);}
.smp-active{background:var(--teal);}
.smp-pending{background:var(--s3);}

/* CLIENT ROW */
.client-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--s2);border:0.5px solid var(--border);border-radius:var(--r-sm);margin-bottom:6px;cursor:pointer;transition:all .15s;}
.client-row:hover{border-color:var(--border2);background:var(--s3);}
.cr-info{flex:1;}
.cr-name{font-size:13px;font-weight:500;color:var(--text);}
.cr-date{font-size:11px;color:var(--text3);margin-top:1px;}
.cr-prog{max-width:100px;width:100px;}
.cr-track{height:3px;background:var(--s3);border-radius:2px;overflow:hidden;}
.cr-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--teal-d),var(--teal-l));}
.cr-pct{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:3px;}
.cr-dots{display:flex;gap:4px;}

/* ARCHIVE */
.btn-archive{font-size:10px;color:var(--text3);background:none;border:0.5px solid var(--border);border-radius:var(--r-xs);padding:3px 8px;cursor:pointer;font-family:var(--font);flex-shrink:0;transition:all .15s;}

// ── INIT ──
async function init() {
  sb = supabase.createClient(SB_URL, SB_KEY);
  await loadClients();
}

async function loadClients() {
  try {
    document.getElementById('home-count').textContent = 'Cargando...';
    document.getElementById('client-grid').innerHTML = '<div class="empty"><p>Cargando clientes...</p></div>';

    const { data: clientsData, error: clientsError } = await sb
      .from('diop_clients')
      .select('*')
      .or('archived.is.null,archived.eq.false')
      .order('created_at', { ascending: false });

    if (clientsError) {
      console.error('Error cargando clientes:', JSON.stringify(clientsError, null, 2));
      throw clientsError;
    }

    const { data: answersData, error: answersError } = await sb
      .from('diop_answers')
      .select('client_id, session, question_id, answer, updated_at');

    if (answersError) {
      console.error('Error cargando respuestas:', JSON.stringify(answersError, null, 2));
      throw answersError;
    }

    const { data: reportsData, error: reportsError } = await sb
      .from('diop_reports')
      .select('id, client_id, created_at, report_json, created_by')
      .order('created_at', { ascending: false });

    if (reportsError) {
      console.error('Error cargando informes:', JSON.stringify(reportsError, null, 2));
      throw reportsError;
    }

    allAnswers = {};
    (answersData || []).forEach(a => {
      allAnswers[`${a.client_id}_${a.session}_${a.question_id}`] = a.answer || '';
    });

    const answersByClient = {};
    (answersData || []).forEach(a => {
      if (!answersByClient[a.client_id]) answersByClient[a.client_id] = [];
      answersByClient[a.client_id].push(a);
    });

    const reportsByClient = {};
    (reportsData || []).forEach(r => {
      if (!reportsByClient[r.client_id]) reportsByClient[r.client_id] = [];
      reportsByClient[r.client_id].push(r);
    });

    clients = (clientsData || []).map(c => {
      const clientAnswers = answersByClient[c.id] || [];
      const clientReports = reportsByClient[c.id] || [];

      const lastAnswerAt = clientAnswers.length
        ? clientAnswers
            .map(a => a.updated_at ? new Date(a.updated_at).getTime() : 0)
            .filter(Boolean)
            .sort((a, b) => b - a)[0]
        : null;

      const lastReportAt = clientReports.length
        ? new Date(clientReports[0].created_at).getTime()
        : null;

      const createdAt = c.created_at ? new Date(c.created_at).getTime() : 0;

      const lastActivityAt = [createdAt, lastAnswerAt, lastReportAt]
        .filter(Boolean)
        .sort((a, b) => b - a)[0] || createdAt;

      return {
        ...c,
        answers: clientAnswers,
        reports: clientReports,
        last_activity_at: lastActivityAt ? new Date(lastActivityAt).toISOString() : null,
        last_report_at: lastReportAt ? new Date(lastReportAt).toISOString() : null
      };
    });

    clients.sort((a, b) => {
      const da = a.last_activity_at ? new Date(a.last_activity_at).getTime() : 0;
      const db = b.last_activity_at ? new Date(b.last_activity_at).getTime() : 0;
      return db - da;
    });

    renderHome();
  } catch (err) {
    console.error('Fallo en loadClients:', err);
    showToast('Error al cargar clientes');
    document.getElementById('home-count').textContent = 'Error';
    document.getElementById('client-grid').innerHTML = `
      <div class="empty">
        <p>No se pudieron cargar los diagnósticos.</p>
      </div>
    `;
  }
}

function markExistingAnswers(sessionId) {
  const sess = SESSIONS[sessionId];
  sess.blocks.forEach(block => {
    block.questions.forEach(q => {
      const val = allAnswers[`${currentClient.id}_${sessionId}_${q.id}`];
      if(val && val.trim()) {
        // find card by looking for the data attributes nearby
        const containers = document.querySelectorAll(`[data-sess="${sessionId}"][data-qid="${q.id}"]`);
        containers.forEach(c => {
          const card = c.closest('.q-card');
          if(card) card.classList.add('q-answered');
        });
        // also check num/txt inputs
        const inputs = document.querySelectorAll(`[data-type="num"][data-qid="${q.id}"], [data-type="txt"][data-qid="${q.id}"]`);
        inputs.forEach(inp => {
          const card = inp.closest('.q-card');
          if(card) card.classList.add('q-answered');
        });
      }
    });
  });
  updateBlockProgress();
}

let saveTimers = {};
function attachSessionEvents() {
  const sc = document.getElementById('session-content');
  if (!sc) return;
  
  if (sessionEventsBound) return;
  sessionEventsBound = true;

  sc.addEventListener('click', async function(e) {
    const btn = e.target.closest('button[data-val]');
    if(!btn) return;
    const container = btn.closest('[data-sess][data-qid]');
    if(!container) return;
    const sess = container.dataset.sess;
    const qid = container.dataset.qid;
    const val = btn.dataset.val;
    const type = container.dataset.type;
    

    if(type === 'yn') {
      container.querySelectorAll('button').forEach(b => b.classList.remove('yn-sel-y','yn-sel-n'));
      btn.classList.add(val === 'Sí' ? 'yn-sel-y' : 'yn-sel-n');
      await persistAnswer(sess, qid, val);
      markCardAnswered(btn.closest('.q-card'), val);
    } else if(type === 'sel') {
      container.querySelectorAll('button').forEach(b => b.classList.remove('opt-sel'));
      btn.classList.add('opt-sel');
      await persistAnswer(sess, qid, val);
      markCardAnswered(btn.closest('.q-card'), val);
    } else if(type === 'multi') {
      const key = `${currentClient.id}_${sess}_${qid}`;
      let current = allAnswers[key] ? allAnswers[key].split('||') : [];
      if(current.includes(val)) {
        current = current.filter(v => v !== val);
        btn.classList.remove('opt-multi-sel');
      } else {
        current.push(val);
        btn.classList.add('opt-multi-sel');
      }
      const newVal = current.join('||');
      await persistAnswer(sess, qid, newVal);
      markCardAnswered(btn.closest('.q-card'), newVal);
    }
  });

  sc.addEventListener('input', function(e) {
    const el = e.target;
    if(!el.dataset.sess || !el.dataset.qid) return;
    const key = el.dataset.sess + '_' + el.dataset.qid;
    clearTimeout(saveTimers[key]);
    saveTimers[key] = setTimeout(async () => {
      await persistAnswer(el.dataset.sess, el.dataset.qid, el.value);
      markCardAnswered(el.closest('.q-card'), el.value);
    }, 600);
  });
}

function markCardAnswered(card, val) {
  if(!card) return;
  if(val && val.toString().trim() !== '') {
    card.classList.add('q-answered');
    card.classList.remove('q-missing');
  } else {
    card.classList.remove('q-answered');
  }
  updateBlockProgress();
  // update missing count if banner is visible
  const remaining = document.querySelectorAll('.q-card.q-missing').length;
  const banner = document.getElementById('missing-banner');
  if(banner && banner.classList.contains('visible')) {
    if(remaining === 0) {
      banner.classList.remove('visible');
    } else {
      const text = document.getElementById('missing-text');
      const count = document.getElementById('missing-count');
      if(text) text.textContent = `Hay ${remaining} pregunta${remaining!==1?'s':''} crítica${remaining!==1?'s':''} sin responder`;
      if(count) count.textContent = `${remaining} pendiente${remaining!==1?'s':''}`;
    }
  }
}

function updateBlockProgress() {
  const blocks = document.querySelectorAll('.q-block');
  const bpItems = document.querySelectorAll('.bp');
  blocks.forEach((block, i) => {
    const total = block.querySelectorAll('.q-card').length;
    const answered = block.querySelectorAll('.q-card.q-answered').length;
    if(i < bpItems.length) {
      bpItems[i].className = 'bp' + (answered === total ? ' bp-done' : answered > 0 ? ' bp-active' : '');
    }
    const header = block.querySelector('.qb-header');
    if(header) {
      if(answered === total) header.classList.add('block-complete');
      else header.classList.remove('block-complete');
    }
    // update count in header
    const countEl = block.querySelector('.qbh-count');
    if(countEl) countEl.textContent = `${answered}/${total} respondidas`;
  });
  updateSessionProgress(currentSession);
}

function updateSessionProgress(sessionId) {
  const sess = SESSIONS[sessionId];
  let total=0,answered=0;
  sess.blocks.forEach(b=>b.questions.forEach(q=>{
    total++;
    if(allAnswers[`${currentClient.id}_${sessionId}_${q.id}`]?.trim()) answered++;
  }));
  const el = document.getElementById('sb-progress');
  if(el) el.textContent = `${answered} de ${total} preguntas respondidas`;
}

async function saveAnswer(sessionId, questionId, value, btn, selClass) {
  // For single-select: deselect siblings
  const parent = btn.closest('.yn-row, .opt-grid');
  if(parent) parent.querySelectorAll('button').forEach(b=>{
    b.classList.remove('yn-sel-y','yn-sel-n','opt-sel');
  });
  btn.classList.add(selClass);
  await persistAnswer(sessionId, questionId, value);
}

async function saveMulti(sessionId, questionId, value, btn) {
  const key = `${currentClient.id}_${sessionId}_${questionId}`;
  let current = allAnswers[key] ? allAnswers[key].split('||') : [];
  if(current.includes(value)) {
    current = current.filter(v=>v!==value);
    btn.classList.remove('opt-multi-sel');
  } else {
    current.push(value);
    btn.classList.add('opt-multi-sel');
  }
  const newVal = current.join('||');
  await persistAnswer(sessionId, questionId, newVal);
}

async function saveAnswerDirect(sessionId, questionId, value) {
  await persistAnswer(sessionId, questionId, value);
}

async function persistAnswer(sessionId, questionId, value) {
  const key = `${currentClient.id}_${sessionId}_${questionId}`;
  const now = new Date().toISOString();

  allAnswers[key] = value;

  dirtySessions[sessionId] = true;
  dirtyQuestions[`${sessionId}_${questionId}`] = true;

  // Sincronizar también el estado local del cliente activo
  if (!currentClient.answers) currentClient.answers = [];

  const existingAnswer = currentClient.answers.find(a =>
    a.session === sessionId && a.question_id === questionId
  );

  if (existingAnswer) {
    existingAnswer.answer = value;
    existingAnswer.updated_at = now;
  } else {
    currentClient.answers.push({
      client_id: currentClient.id,
      session: sessionId,
      question_id: questionId,
      answer: value,
      updated_at: now
    });
  }

  // Sincronizar también el array global de clientes
  const clientIndex = clients.findIndex(c => String(c.id) === String(currentClient.id));
  if (clientIndex !== -1) {
    clients[clientIndex].answers = [...currentClient.answers];
    clients[clientIndex].last_activity_at = now;
  }

  updateSessionProgress(sessionId);
  renderSidebarRoadmap();

  await sb.from('diop_answers').upsert({
    client_id: currentClient.id,
    session: sessionId,
    question_id: questionId,
    answer: value,
    updated_at: now
  }, { onConflict: 'client_id,session,question_id' });
}

async function completeSession(sessionId) {
  const missing = getMissingCritical(sessionId);
  if(missing.length > 0) {
    highlightMissing(missing);
    return;
  }
  clearMissingHighlights();
  // Save explicit completion flag
  await persistAnswer(sessionId, '_completed', 'true');
  showToast('Sesión completada ✓');
  renderSidebarRoadmap();
  const prog = getProgress(currentClient);
  const nextSess = SESSION_ORDER.find(s=>s!==sessionId && prog.sessions[s]!=='done');
  if(!nextSess || SESSION_ORDER.every(s=>prog.sessions[s]==='done' || s===sessionId)) {
    setTimeout(()=>openReport(),800);
  } else {
    setTimeout(()=>openSession(nextSess),800);
  }
}

function getMissingCritical(sessionId) {
  const sess = SESSIONS[sessionId];
  const missing = [];
  sess.blocks.forEach(block => {
    block.questions.forEach(q => {
      if(q.prio === 'c') {
        const val = allAnswers[`${currentClient.id}_${sessionId}_${q.id}`];
        if(!val || val.trim() === '') missing.push(q.id);
      }
    });
  });
  return missing;
}

function highlightMissing(missingIds) {
  clearMissingHighlights();
  let firstMissing = null;
  missingIds.forEach(qid => {
    const containers = document.querySelectorAll(`[data-qid="${qid}"]`);
    containers.forEach(c => {
      const card = c.closest('.q-card');
      if(card) {
        card.classList.add('q-missing');
        if(!firstMissing) firstMissing = card;
      }
    });
    // also check num/txt
    const inputs = document.querySelectorAll(`[data-qid="${qid}"]`);
    inputs.forEach(inp => {
      const card = inp.closest('.q-card');
      if(card) {
        card.classList.add('q-missing');
        if(!firstMissing) firstMissing = card;
      }
    });
  });
  const banner = document.getElementById('missing-banner');
  const text = document.getElementById('missing-text');
  const count = document.getElementById('missing-count');
  if(banner) {
    banner.classList.add('visible');
    if(text) text.textContent = `Hay ${missingIds.length} pregunta${missingIds.length!==1?'s':''} crítica${missingIds.length!==1?'s':''} sin responder`;
    if(count) count.textContent = `${missingIds.length} pendiente${missingIds.length!==1?'s':''}`;
  }
  if(firstMissing) {
    firstMissing.scrollIntoView({behavior:'smooth', block:'center'});
  }
}

function clearMissingHighlights() {
  document.querySelectorAll('.q-card.q-missing').forEach(c => c.classList.remove('q-missing'));
  const banner = document.getElementById('missing-banner');
  if(banner) banner.classList.remove('visible');
}

async function createClient() {
  const name = document.getElementById('nc-name').value.trim();
  const sector = document.getElementById('nc-sector').value;
  const employees = document.getElementById('nc-employees').value;
  if(!name||!sector){showToast('Nombre y sector son obligatorios');return;}
  const btn = document.getElementById('btn-create');
  btn.disabled=true; btn.textContent='Creando...';
  const {data,error} = await sb.from('diop_clients').insert([{name,sector,employees:employees||null}]).select();
  btn.disabled=false; btn.textContent='Crear diagnóstico';
  if(error){showToast('Error al crear cliente');return;}
  closeModal();
  document.getElementById('nc-name').value='';
  document.getElementById('nc-sector').value='';
  document.getElementById('nc-employees').value='';
  await loadClients();
  openClient(data[0].id);
}

async function archiveClient(e, clientId, clientName) {
  e.stopPropagation();
  if (!confirm(`¿Archivar "${clientName}"?\nDesaparecerá de la lista pero los datos se conservan.`)) return;
  const { error } = await sb.from('diop_clients').update({ archived: true }).eq('id', clientId);
  if (error) { showToast('Error al archivar'); return; }
  clients = clients.filter(c => String(c.id) !== String(clientId));
  document.getElementById('home-count').textContent = `${clients.length} diagnóstico${clients.length!==1?'s':''} activo${clients.length!==1?'s':''}`;
  filterClients();
  showToast(`"${clientName}" archivado`);

async function loadNotes(clientId) {

function scheduleNoteSave() {
  clearTimeout(notesSaveTimer);
  document.getElementById('notes-saved').textContent = 'Guardando...';
  notesSaveTimer = setTimeout(saveNote, 800);
}

async function saveNote() {
  if (!currentClient) return;
  const content = document.getElementById('notes-area')?.value || '';
  notesCache[currentNotesTab] = content;
  const { error } = await sb.from('diop_notes').upsert({
    client_id: currentClient.id,
    session: currentNotesTab,
    content,
    updated_at: new Date().toISOString()
  }, { onConflict: 'client_id,session' });
  document.getElementById('notes-saved').textContent = error ? 'Error al guardar' : 'Guardado ✓';
  setTimeout(() => {
    const el = document.getElementById('notes-saved');
    if (el) el.textContent = '';
  }, 2000);
}
  function formatDateRelative(dateStr) {
  if (!dateStr) return 'Sin actividad';

  const now = new Date();
  const date = new Date(dateStr);
  const diffMs = now - date;

  const diffMin = Math.floor(diffMs / 60000);
  const diffH = Math.floor(diffMs / 3600000);
  const diffD = Math.floor(diffMs / 86400000);

  if (diffMin < 1) return 'Ahora mismo';
  if (diffMin < 60) return `Hace ${diffMin} min`;
  if (diffH < 24) return `Hace ${diffH} h`;
  if (diffD < 7) return `Hace ${diffD} días`;

  return date.toLocaleDateString();
}

function getProgress(client) {
  const sessions = {};

  SESSION_ORDER.forEach(sid => {
    const completed = client.answers?.find(a => a.session === sid && a.question_id === '_completed');
    const answered = client.answers?.filter(a => a.session === sid && a.question_id !== '_completed').length || 0;
    sessions[sid] = completed ? 'done' : answered > 0 ? 'active' : 'pending';
  });

  const done = Object.values(sessions).filter(v => v === 'done').length;

  const latestAnswerAt = (client.answers || [])
    .map(a => a.updated_at ? new Date(a.updated_at).getTime() : 0)
    .filter(Boolean)
    .sort((a, b) => b - a)[0] || 0;

  const latestReportAt = (client.reports || []).length
    ? new Date(client.reports[0].created_at).getTime()
    : 0;

  const reportOutdated = latestAnswerAt > latestReportAt;

  return {
    sessions,
    pct: Math.round((done / SESSION_ORDER.length) * 100),
    reportOutdated
  };
}

function openClient(clientId) {
  currentClient = clients.find(c => String(c.id) === String(clientId));
  if (!currentClient) {
    console.error('Cliente no encontrado. clientId:', clientId, 'clients:', clients);
    showToast('No se pudo abrir el cliente');
    return;
  }

  allAnswers = {};
  (currentClient.answers || []).forEach(a => {
    allAnswers[`${currentClient.id}_${a.session}_${a.question_id}`] = a.answer;
  });

  document.getElementById('topbar-client').textContent = currentClient.name;
  document.getElementById('topbar-back').classList.add('visible');
  document.getElementById('sidebar-home-content').style.display = 'none';
  document.getElementById('sidebar-client-content').style.display = 'block';
  document.getElementById('sc-name').textContent = currentClient.name;
  document.getElementById('sc-meta').textContent = currentClient.sector || '';

renderSidebarRoadmap();
  document.getElementById('sidebar-notes').style.display = 'block';
  currentNotesTab = 'general';
  document.querySelectorAll('.notes-tab').forEach((b,i) => b.classList.toggle('active', i===0));
  loadNotes(currentClient.id);
  const prog = getProgress(currentClient);
  const allDone = SESSION_ORDER.every(s => prog.sessions[s] === 'done');
  const reportOutdated = prog.reportOutdated;
  const nextSess = SESSION_ORDER.find(s => prog.sessions[s] !== 'done') || 'ceo';

  if (allDone) openReport();
  else openSession(nextSess);
}

function renderSidebarRoadmap() {
  const prog = currentClient ? getProgress(currentClient) : null;

  const html = SESSION_ORDER.map(sid => {
    const state = prog ? prog.sessions[sid] : 'pending';
    const isDirty = !!dirtySessions[sid];

    const circleClass =
      state === 'done'
        ? (isDirty ? 'rc-dirty' : 'rc-done')
        : state === 'active'
          ? 'rc-active'
          : 'rc-pending';

    const labelClass =
      state === 'done'
        ? (isDirty ? 'rly' : 'rld')
        : state === 'active'
          ? 'rla'
          : '';

    const icon =
      state === 'done'
        ? (isDirty ? '!' : '✓')
        : state === 'active'
          ? '→'
          : '○';

    const isActive = currentSession === sid;

    return `<div class="rm-item ${isActive ? 'rm-active' : ''}" onclick="openSession('${sid}')">
      <div class="rm-circle ${circleClass}">${icon}</div>
      <div class="rm-label ${labelClass}">${SESSIONS[sid].label}</div>
    </div>`;
  }).join('');

  const reportState = prog && SESSION_ORDER.every(s => prog.sessions[s] === 'done')
    ? 'rc-done'
    : 'rc-pending';

  document.getElementById('sidebar-roadmap').innerHTML = html +
    `<div class="rm-item ${currentSession === 'report' ? 'rm-active' : ''}" onclick="openReport()">
      <div class="rm-circle ${reportState}">📄</div>
      <div class="rm-label">Informe DIOP</div>
    </div>`;
}

function renderHome() {
  const count = clients.length;
  document.getElementById('home-count').textContent = `${count} diagnóstico${count !== 1 ? 's' : ''} activo${count !== 1 ? 's' : ''}`;
  const grid = document.getElementById('client-grid');
  if (count === 0) {
    grid.innerHTML = `<div class="empty"><p>No hay diagnósticos todavía.</p></div>`;
    return;
  }
  grid.innerHTML = `
    <div class="search-wrap">
      <input class="search-input" id="client-search" type="text" placeholder="Buscar empresa..." oninput="filterClients()">
    </div>
    <div id="clients-grouped"></div>`;
  renderGrouped(clients);
}

const SECTOR_ICONS = {
  'Alimentación y bebidas':'🥫','Farmacéutico':'💊','Cosmética y cuidado personal':'🧴',
  'Metal y componentes':'⚙️','Plástico y caucho':'🔧','Papel y cartón':'📦',
  'Química':'🧪','Electrónica':'💡','Automoción':'🚗','Textil':'🧵','Otro':'🏭'
};
let openSectors = {};

function renderGrouped(list) {
  const container = document.getElementById('clients-grouped');
  if (!container) return;
  if (list.length === 0) {
    container.innerHTML = `<div class="empty"><p>No hay resultados.</p></div>`;
    return;
  }
  const groups = {};
  list.forEach(c => {
    const sector = c.sector || 'Sin sector';
    if (!groups[sector]) groups[sector] = [];
    groups[sector].push(c);
  });
  const html = Object.keys(groups).sort().map(sector => {
    const isOpen = openSectors[sector] !== false;
    const icon = SECTOR_ICONS[sector] || '🏭';
    const clientsHtml = groups[sector].map(c => {
      const prog = getProgress(c);
      const dotsHtml = SESSION_ORDER.map(sid => {
        const state = prog.sessions[sid];
        const cls = state==='done'?'csd-done':state==='active'?'csd-active':'csd-pending';
        return `<div class="cs-dot ${cls}"><div class="csd-icon"></div>${SESSION_LABELS[sid]}</div>`;
      }).join('');
      return `<div class="client-row" data-client-id="${c.id}">
        <div class="cr-info">
          <div class="cr-name">${c.name}</div>
          <div class="cr-date">${formatDateRelative(c.last_activity_at)}</div>
        </div>
        <div class="cr-prog">
          <div class="cr-track"><div class="cr-fill" style="width:${prog.pct}%"></div></div>
          <div class="cr-pct">${prog.pct}%</div>
        </div>
        <div class="cr-dots">${dotsHtml}</div>
        <button class="btn-archive" onclick="archiveClient(event,'${c.id}','${c.name.replace(/'/g,"\\'").replace(/"/g,'&quot;')}')">Archivar</button>
      </div>`;
    }).join('');
    const firstProg = getProgress(groups[sector][0]);
    const miniProg = SESSION_ORDER.map(sid => {
      const state = firstProg.sessions[sid];
      return `<div class="smp smp-${state}"></div>`;
    }).join('');
    return `<div class="sector-card ${isOpen?'open':''}" id="sc-${sector.replace(/\s/g,'_')}">
      <div class="sector-header" onclick="toggleSector('${sector.replace(/'/g,"\\'")}')">
        <div class="sector-icon">${icon}</div>
        <div>
          <div class="sector-name">${sector}</div>
          <div class="sector-meta">${groups[sector].length} empresa${groups[sector].length!==1?'s':''}</div>
        </div>
        <div class="sector-right">
          <div class="sector-mini-prog">${miniProg}</div>
          <div class="sector-count">${groups[sector].length}</div>
          <div class="sector-chevron">▼</div>
        </div>
      </div>
      <div class="sector-body">${clientsHtml}</div>
    </div>`;
  }).join('');
  container.innerHTML = html;
  container.querySelectorAll('.client-row[data-client-id]').forEach(row => {
    row.addEventListener('click', function(e) {
      if (e.target.closest('.btn-archive')) return;
      openClient(row.dataset.clientId);
    });
  });
}

function toggleSector(sector) {
  openSectors[sector] = openSectors[sector] === false ? true : false;
  const term = document.getElementById('client-search')?.value || '';
  renderGrouped(term ? clients.filter(c => c.name.toLowerCase().includes(term.toLowerCase())) : clients);
}

function filterClients() {
  const term = (document.getElementById('client-search')?.value||'').toLowerCase();
  renderGrouped(term ? clients.filter(c => c.name.toLowerCase().includes(term)) : clients);
}
