}

function removeProcess(idx) {
  const vsm = getVSM();
  vsm.processes.splice(idx, 1);
  // Clean up inventories between
  const newBetween = {};
  for (let i = 0; i < vsm.processes.length - 1; i++) {
    const oldKey = Object.keys(vsm.inventories.between || {}).find(k => {
      const parts = k.split('_');
      return parseInt(parts[0]) === i || parseInt(parts[0]) === i + 1;
    });
    // Reset - user will need to re-enter
  }
  vsm.inventories.between = {};
  renderVSM();
}

// ── RESULTS ──
function renderVSMResults() {
  const vsm = getVSM();
  const el = document.getElementById('vsm-results');
  if (!el) return;
  
  const takt = calcTaktTime(vsm);
  const procs = vsm.processes;
  if (!procs.length) { el.innerHTML = '<div style="color:var(--text4);font-size:12px;">Añade procesos para ver resultados</div>'; return; }
  
  // Total VA
  let totalVA = 0;
  procs.forEach(p => { const ct = normalizeCT(p); if (ct) totalVA += ct; });
  
  // Total NVA
  let totalNVA = 0;
  // MP
  const mpDays = parseFloat(vsm.inventories.mp);
  if (mpDays) totalNVA += mpDays * 24 * 3600;
  // Between
  for (let i = 0; i < procs.length - 1; i++) {
    const key = `${i}_${i+1}`;
    const wip = parseFloat(vsm.inventories.between?.[key]);
    const nextCT = normalizeCT(procs[i+1]);
    if (wip && nextCT) totalNVA += wip * nextCT;
  }
  // PT
  const ptUnits = parseFloat(vsm.inventories.pt);
  const demandDay = parseFloat(vsm.demand.units_per_day);
  if (ptUnits && demandDay) totalNVA += (ptUnits / demandDay) * 24 * 3600;
  
  const leadTime = totalVA + totalNVA;
  const vaRatio = leadTime > 0 ? (totalVA / leadTime) * 100 : 0;
  
  // Bottlenecks
  const bottlenecks = procs.filter(p => { const eff = effectiveCT(p); return takt && eff && eff > takt; });
  
  el.innerHTML = `
    <div class="vsm-results-grid" style="margin-top:12px;">
      <div class="vsm-result-card">
        <div class="vsm-result-val">${takt ? takt.toFixed(2) : '—'}</div>
        <div class="vsm-result-label">Takt Time (seg)</div>
      </div>
      <div class="vsm-result-card">
        <div class="vsm-result-val">${formatTime(totalVA)}</div>
        <div class="vsm-result-label">Valor Añadido</div>
      </div>
      <div class="vsm-result-card">
        <div class="vsm-result-val">${formatTime(leadTime)}</div>
        <div class="vsm-result-label">Lead Time Total</div>
      </div>
      <div class="vsm-result-card">
        <div class="vsm-result-val ${vaRatio < 1 ? 'bad' : vaRatio < 5 ? 'warn' : ''}">${vaRatio > 0 ? vaRatio.toFixed(4) + '%' : '—'}</div>
        <div class="vsm-result-label">Ratio VA</div>
      </div>
    </div>
    ${bottlenecks.length ? `<div style="margin-top:12px;padding:10px 14px;background:rgba(226,75,74,0.06);border:0.5px solid rgba(226,75,74,0.2);border-radius:var(--r-sm);">
      <div style="font-size:12px;font-weight:600;color:var(--red);margin-bottom:4px;">⚠ Cuellos de botella detectados</div>
      ${bottlenecks.map(b => `<div style="font-size:11px;color:var(--text2);margin-top:2px;">• <strong>${b.name||'Sin nombre'}</strong> — C/T efectivo: ${effectiveCT(b).toFixed(2)} seg/ud (takt: ${takt.toFixed(2)})</div>`).join('')}
    </div>` : ''}
  `;
}

// ── SVG DIAGRAM ──
function renderVSMDiagram() {
  const vsm = getVSM();
  const el = document.getElementById('vsm-diagram');
  if (!el) return;
  
  const procs = vsm.processes;
  if (!procs.length) { el.innerHTML = '<div style="color:var(--text4);font-size:12px;text-align:center;padding:40px;">Añade procesos para generar el diagrama</div>'; return; }
  
  const takt = calcTaktTime(vsm);
  const n = procs.length;
  const procW = 100, procH = 40, dataH = 65, gap = 60;
  const marginL = 120, marginR = 120, marginTop = 90, procY = 150;
  const totalW = marginL + n * procW + (n - 1) * gap + marginR;
  const totalH = procY + procH + dataH + 120;
  
  let svg = `<svg viewBox="0 0 ${totalW} ${totalH}" xmlns="http://www.w3.org/2000/svg" style="font-family:'DM Sans',sans-serif;">`;
  
  // Background
  svg += `<rect width="${totalW}" height="${totalH}" fill="transparent"/>`;
  
  // Colors
  const cBg = '#0f1a2e', cBorder = '#1a3a4a', cText = '#e8f4f5', cText2 = '#7ab0b8', cText3 = '#3a7a82', cTeal = '#00adb5', cRed = '#E24B4A';
  
  // ── SUPPLIER (top left) ──
  const supX = 20, supY = 15;
  svg += `<rect x="${supX}" y="${supY}" width="80" height="40" fill="${cBg}" stroke="${cBorder}" stroke-width="1" rx="3"/>`;
  svg += `<polygon points="${supX+25},${supY} ${supX+55},${supY} ${supX+40},${supY-15}" fill="${cBg}" stroke="${cBorder}" stroke-width="1"/>`;
  svg += `<text x="${supX+40}" y="${supY+25}" text-anchor="middle" fill="${cText2}" font-size="8" font-weight="600">${vsm.supplier.name||'Proveedor'}</text>`;
  
  // ── CLIENT (top right) ──
  const cliX = totalW - 100, cliY = 15;
  svg += `<rect x="${cliX}" y="${cliY}" width="80" height="40" fill="${cBg}" stroke="${cBorder}" stroke-width="1" rx="3"/>`;
  svg += `<polygon points="${cliX+25},${cliY} ${cliX+55},${cliY} ${cliX+40},${cliY-15}" fill="${cBg}" stroke="${cBorder}" stroke-width="1"/>`;
  svg += `<text x="${cliX+40}" y="${cliY+20}" text-anchor="middle" fill="${cText2}" font-size="8" font-weight="600">${vsm.client_info.name||'Cliente'}</text>`;
  svg += `<text x="${cliX+40}" y="${cliY+32}" text-anchor="middle" fill="${cText3}" font-size="6">${vsm.demand.units_per_day||'?'} uds/día</text>`;
  
  // ── PLANNING (top center) ──
  const planX = totalW / 2 - 60, planY = 8;
  svg += `<rect x="${planX}" y="${planY}" width="120" height="32" fill="${cBg}" stroke="${cTeal}" stroke-width="1" rx="3"/>`;
  svg += `<text x="${planX+60}" y="${planY+20}" text-anchor="middle" fill="${cTeal}" font-size="8" font-weight="600">${vsm.planning.type||'PLANIFICACIÓN'}</text>`;
  
  // ── INFO ARROWS ──
  // Client → Planning
  svg += `<line x1="${cliX}" y1="${cliY+20}" x2="${planX+120}" y2="${planY+16}" stroke="${cText3}" stroke-width="0.8" stroke-dasharray="4,2" marker-end="url(#arrowInfo)"/>`;
  svg += `<text x="${(cliX+planX+120)/2}" y="${cliY+10}" text-anchor="middle" fill="${cText3}" font-size="5.5">Pedidos</text>`;
  
  // Planning → Supplier
  svg += `<line x1="${planX}" y1="${planY+16}" x2="${supX+80}" y2="${supY+20}" stroke="${cText3}" stroke-width="0.8" stroke-dasharray="4,2" marker-end="url(#arrowInfo)"/>`;
  svg += `<text x="${(planX+supX+80)/2}" y="${supY+10}" text-anchor="middle" fill="${cText3}" font-size="5.5">Pedido MP</text>`;
  
  // Planning → Processes
  procs.forEach((p, i) => {
    const px = marginL + i * (procW + gap) + procW / 2;
    svg += `<line x1="${px}" y1="${planY+32}" x2="${px}" y2="${procY}" stroke="${cText3}" stroke-width="0.6" stroke-dasharray="3,2" marker-end="url(#arrowInfo)"/>`;
  });
  svg += `<text x="${totalW/2}" y="${planY+48}" text-anchor="middle" fill="${cText3}" font-size="5">Programa ${vsm.planning.frequency||'semanal'}</text>`;
  
  // Arrow defs
  svg += `<defs>
    <marker id="arrowInfo" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="${cText3}"/>
    </marker>
    <marker id="arrowFlow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="${cTeal}"/>
    </marker>
  </defs>`;
  
  // ── MP INVENTORY ──
  const mpX = marginL - 50, mpY = procY + procH / 2;
  if (vsm.inventories.mp) {
    svg += drawTriangle(mpX - 20, mpY - 10, `${vsm.inventories.mp}d`, cText2, cBorder);
  }
  
  // ── PROCESSES + DATA BOXES ──
  procs.forEach((p, i) => {
    const px = marginL + i * (procW + gap);
    const ctEff = effectiveCT(p);
    const isBot = takt && ctEff && ctEff > takt;
    const borderC = isBot ? cRed : cBorder;
    
    // Process box
    svg += `<rect x="${px}" y="${procY}" width="${procW}" height="${procH}" fill="${cBg}" stroke="${borderC}" stroke-width="${isBot?1.5:1}" rx="2"/>`;
    svg += `<text x="${px+procW/2}" y="${procY+procH/2+4}" text-anchor="middle" fill="${cText}" font-size="8" font-weight="600">${p.name||'Proceso '+(i+1)}</text>`;
    
    // Data box
    const dy = procY + procH;
    svg += `<rect x="${px}" y="${dy}" width="${procW}" height="${dataH}" fill="${cBg}" stroke="${borderC}" stroke-width="0.5" rx="2"/>`;
    const ctNorm = normalizeCT(p);
    const lines = [
      `C/T: ${ctNorm !== null ? ctNorm.toFixed(2)+' s' : '—'}`,
      `C/O: ${p.co||'—'} min`,
      `Up: ${p.uptime||'—'}%`,
      `Op: ${p.operators||'—'}`
    ];
    lines.forEach((l, li) => {
      svg += `<text x="${px+6}" y="${dy+12+li*13}" fill="${cText3}" font-size="6.5" font-family="'DM Mono',monospace">${l}</text>`;
    });
    if (isBot) {
      svg += `<text x="${px+procW/2}" y="${dy+dataH+12}" text-anchor="middle" fill="${cRed}" font-size="6" font-weight="600">⚠ CUELLO DE BOTELLA</text>`;
    }
    
    // Flow arrow to next process
    if (i < n - 1) {
      svg += `<line x1="${px+procW}" y1="${procY+procH/2}" x2="${px+procW+gap}" y2="${procY+procH/2}" stroke="${cTeal}" stroke-width="1.5" marker-end="url(#arrowFlow)"/>`;
    }
    
    // Inventory triangle between processes
    if (i < n - 1) {
      const key = `${i}_${i+1}`;
      const wip = vsm.inventories.between?.[key];
      if (wip) {
        const tx = px + procW + gap / 2;
        const nextCT = normalizeCT(procs[i+1]);
        const timeS = invToTime(wip, nextCT);
        svg += drawTriangle(tx - 12, procY + procH + 15, wip, cText2, cBorder);
        if (timeS !== null) {
          svg += `<text x="${tx}" y="${procY+procH+55}" text-anchor="middle" fill="${cTeal}" font-size="5.5" font-family="'DM Mono',monospace">${formatTimeShort(timeS)}</text>`;
        }
      }
    }
  });
  
  // ── PT INVENTORY ──
  const lastPx = marginL + (n - 1) * (procW + gap) + procW;
  if (vsm.inventories.pt) {
    const ptX = lastPx + 25;
    const demDay = parseFloat(vsm.demand.units_per_day);
    const ptD = demDay ? (parseFloat(vsm.inventories.pt) / demDay) : null;
    svg += drawTriangle(ptX, procY + procH / 2 - 10, vsm.inventories.pt, cText2, cBorder);
    if (ptD) svg += `<text x="${ptX+12}" y="${procY+procH/2+25}" text-anchor="middle" fill="${cTeal}" font-size="5.5" font-family="'DM Mono',monospace">${ptD.toFixed(1)}d</text>`;
  }
  
  // ── TIMELINE ──
  const tlY = procY + procH + dataH + 30;
  let totalVA = 0, totalNVA = 0;
  procs.forEach(p => { const ct = normalizeCT(p); if (ct) totalVA += ct; });
  
  const mpDays = parseFloat(vsm.inventories.mp);
  if (mpDays) totalNVA += mpDays * 24 * 3600;
  for (let i = 0; i < procs.length - 1; i++) {
    const key = `${i}_${i+1}`;
    const wip = parseFloat(vsm.inventories.between?.[key]);
    const nextCT = normalizeCT(procs[i+1]);
    if (wip && nextCT) totalNVA += wip * nextCT;
  }
  const ptUnits = parseFloat(vsm.inventories.pt);
  const demandDay = parseFloat(vsm.demand.units_per_day);
  if (ptUnits && demandDay) totalNVA += (ptUnits / demandDay) * 24 * 3600;
  
  const leadTime = totalVA + totalNVA;
  const vaRatio = leadTime > 0 ? (totalVA / leadTime) * 100 : 0;
  
  svg += `<line x1="20" y1="${tlY}" x2="${totalW-20}" y2="${tlY}" stroke="${cBorder}" stroke-width="0.5"/>`;
  svg += `<text x="20" y="${tlY+14}" fill="${cText3}" font-size="6">Lead Time: ${formatTime(leadTime)}</text>`;
  svg += `<text x="20" y="${tlY+24}" fill="${cText3}" font-size="6">VA: ${formatTime(totalVA)}  ·  Ratio: ${vaRatio > 0 ? vaRatio.toFixed(4)+'%' : '—'}</text>`;
  svg += `<text x="${totalW-20}" y="${tlY+14}" text-anchor="end" fill="${takt?cTeal:cText3}" font-size="6">Takt: ${takt?takt.toFixed(2)+' seg/ud':'—'}</text>`;
  
  svg += `</svg>`;
  el.innerHTML = svg;
}

function drawTriangle(x, y, label, textColor, strokeColor) {
  return `<polygon points="${x},${y+20} ${x+12},${y} ${x+24},${y+20}" fill="none" stroke="${strokeColor}" stroke-width="0.8"/>
    <text x="${x+12}" y="${y+32}" text-anchor="middle" fill="${textColor}" font-size="6" font-family="'DM Mono',monospace">${label}</text>`;
}

  'Metal y componentes': { va_ratio: [1, 8], lead_time_days: [3, 20], uptime: [70, 88], co_min: [20, 60], label: 'Metal' },
  'Plástico y caucho': { va_ratio: [1, 10], lead_time_days: [1, 10], uptime: [75, 92], co_min: [15, 45], label: 'Plástico' },

};

// ── CONCLUSIONS ──
function renderVSMConclusions() {
  const el = document.getElementById('vsm-conclusions');
  if (!el) return;
  
  const vsm = getVSM();
  const procs = vsm.processes;
  if (!procs.length) { el.innerHTML = '<div style="color:var(--text4);font-size:12px;">Añade procesos y datos para generar conclusiones</div>'; return; }
  
  const takt = calcTaktTime(vsm);
  const sector = currentClient?.sector || '';
  const bench = VSM_BENCHMARKS[sector] || VSM_BENCHMARKS['default'];
  
  // Calculate all metrics
  let totalVA = 0;
  procs.forEach(p => { const ct = normalizeCT(p); if (ct) totalVA += ct; });
  
  let totalNVA = 0;
  const nvaBreakdown = [];
  
  const mpDays = parseFloat(vsm.inventories.mp);
  if (mpDays) { const s = mpDays * 24 * 3600; totalNVA += s; nvaBreakdown.push({ name: 'Almacén MP', seconds: s, pct: 0 }); }
  
  for (let i = 0; i < procs.length - 1; i++) {
    const key = `${i}_${i+1}`;
    const wip = parseFloat(vsm.inventories.between?.[key]);
    const nextCT = normalizeCT(procs[i+1]);
    if (wip && nextCT) { const s = wip * nextCT; totalNVA += s; nvaBreakdown.push({ name: `${procs[i].name||'?'} → ${procs[i+1].name||'?'}`, seconds: s, pct: 0 }); }
  }
  
  const ptUnits = parseFloat(vsm.inventories.pt);
  const demandDay = parseFloat(vsm.demand.units_per_day);
  if (ptUnits && demandDay) { const s = (ptUnits / demandDay) * 24 * 3600; totalNVA += s; nvaBreakdown.push({ name: 'Almacén PT', seconds: s, pct: 0 }); }
  
  const leadTime = totalVA + totalNVA;
  const vaRatio = leadTime > 0 ? (totalVA / leadTime) * 100 : 0;
  const leadTimeDays = leadTime / 86400;
  
  // Calculate percentages
  nvaBreakdown.forEach(n => n.pct = totalNVA > 0 ? (n.seconds / (totalNVA + totalVA)) * 100 : 0);
  nvaBreakdown.sort((a, b) => b.seconds - a.seconds);
  
  // Bottlenecks
  const bottlenecks = procs.map((p, i) => ({ ...p, idx: i, ctEff: effectiveCT(p), ctNorm: normalizeCT(p) })).filter(p => takt && p.ctEff && p.ctEff > takt);
  
  // Highest C/O
  const sortedCO = procs.map(p => ({ name: p.name, co: parseFloat(p.co) || 0 })).filter(p => p.co > 0).sort((a, b) => b.co - a.co);
  
  // Lowest uptime
  const sortedUp = procs.map(p => ({ name: p.name, up: parseFloat(p.uptime) || 100 })).sort((a, b) => a.up - b.up);
  
  let html = '';
  
  // ── BENCHMARK COMPARISON ──
  html += `<div style="margin-top:12px;"><div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;">📊 Benchmark sectorial — ${bench.label}</div>`;
  html += `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">`;
  
  const vaStatus = vaRatio <= bench.va_ratio[0] ? 'bad' : vaRatio <= bench.va_ratio[1] ? 'warn' : '';
  const ltStatus = leadTimeDays > bench.lead_time_days[1] ? 'bad' : leadTimeDays > bench.lead_time_days[0] ? 'warn' : '';
  const avgUp = procs.reduce((a, p) => a + (parseFloat(p.uptime) || 0), 0) / procs.length;
  const upStatus = avgUp < bench.uptime[0] ? 'bad' : avgUp < bench.uptime[1] ? 'warn' : '';
  const avgCO = sortedCO.length ? sortedCO.reduce((a, p) => a + p.co, 0) / sortedCO.length : 0;
  const coStatus = avgCO > bench.co_min[1] ? 'bad' : avgCO > bench.co_min[0] ? 'warn' : '';
  
  const benchItems = [
    { label: 'Ratio VA', value: vaRatio > 0 ? vaRatio.toFixed(4) + '%' : '—', bench: bench.va_ratio[0] + '–' + bench.va_ratio[1] + '%', status: vaStatus },
    { label: 'Lead Time', value: leadTimeDays > 0 ? leadTimeDays.toFixed(1) + ' días' : '—', bench: bench.lead_time_days[0] + '–' + bench.lead_time_days[1] + ' días', status: ltStatus },
    { label: 'Uptime medio', value: avgUp > 0 ? avgUp.toFixed(1) + '%' : '—', bench: bench.uptime[0] + '–' + bench.uptime[1] + '%', status: upStatus },
    { label: 'C/O medio', value: avgCO > 0 ? avgCO.toFixed(0) + ' min' : '—', bench: bench.co_min[0] + '–' + bench.co_min[1] + ' min', status: coStatus }
  ];
  
  benchItems.forEach(b => {
    const col = b.status === 'bad' ? 'var(--red)' : b.status === 'warn' ? 'var(--amber)' : 'var(--green)';
    html += `<div style="background:var(--s2);border:0.5px solid var(--border);border-radius:var(--r);padding:12px;text-align:center;">
      <div style="font-size:18px;font-weight:700;color:${col};font-family:var(--mono);">${b.value}</div>
      <div style="font-size:9px;color:var(--text3);margin-top:2px;text-transform:uppercase;">${b.label}</div>
      <div style="font-size:9px;color:var(--text3);margin-top:4px;padding-top:4px;border-top:0.5px solid var(--border);">Sector: ${b.bench}</div>
    </div>`;
  });
  html += `</div></div>`;
  
  // ── LEAD TIME BREAKDOWN ──
  if (nvaBreakdown.length) {
    html += `<div style="margin-top:20px;"><div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;">⏱️ Desglose del Lead Time — ¿Dónde se pierde el tiempo?</div>`;
    html += `<div style="display:flex;flex-direction:column;gap:6px;">`;
    nvaBreakdown.forEach(n => {
      const barW = Math.max(n.pct * 2, 4);
      html += `<div style="display:flex;align-items:center;gap:10px;">
        <div style="width:180px;font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${n.name}</div>
        <div style="flex:1;height:12px;background:var(--s1);border-radius:3px;overflow:hidden;">
          <div style="width:${barW}%;height:100%;background:${n.pct > 40 ? 'var(--red)' : n.pct > 20 ? 'var(--amber)' : 'var(--teal)'};border-radius:3px;"></div>
        </div>
        <div style="width:70px;text-align:right;font-size:11px;color:var(--text2);font-family:var(--mono);">${formatTime(n.seconds)}</div>
        <div style="width:45px;text-align:right;font-size:10px;color:var(--text3);font-family:var(--mono);">${n.pct.toFixed(1)}%</div>
      </div>`;
    });
    html += `</div></div>`;
  }
  
  // ── KEY FINDINGS ──
  html += `<div style="margin-top:20px;"><div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;">🔍 Hallazgos clave</div>`;
  html += `<div style="display:flex;flex-direction:column;gap:8px;">`;
  
  // Finding 1: VA ratio
  if (vaRatio > 0) {
    html += renderFinding('red', `El producto pasa ${leadTimeDays.toFixed(1)} días en planta pero solo se transforma durante ${formatTime(totalVA)}. Ratio de valor añadido: ${vaRatio.toFixed(4)}%.`);
  }
  
  // Finding 2: Where is 80% of lead time
  if (nvaBreakdown.length) {
    let accum = 0;
    const top = [];
    for (const n of nvaBreakdown) {
      top.push(n.name);
      accum += n.pct;
      if (accum >= 75) break;
    }
    html += renderFinding('amber', `El ${accum.toFixed(0)}% del lead time se concentra en: ${top.join(', ')}. Estos son los puntos con mayor potencial de reducción.`);
  }
  
  // Finding 3: Bottlenecks
  if (bottlenecks.length) {
    const bNames = bottlenecks.map(b => `${b.name||'?'} (${b.ctEff.toFixed(2)} seg vs takt ${takt.toFixed(2)} seg)`);
    html += renderFinding('red', `Cuellos de botella detectados: ${bNames.join(', ')}. Estos procesos no pueden seguir el ritmo de la demanda del cliente.`);
  }
  
  // Finding 4: Causal chain (highest C/O → batch → WIP)
  if (sortedCO.length && sortedCO[0].co > 15) {
    html += renderFinding('amber', `${sortedCO[0].name} tiene el changeover más alto (${sortedCO[0].co} min), lo que fuerza lotes grandes, genera sobreproducción y acumula inventario aguas abajo. Candidato prioritario para SMED.`);
  }
  
  // Finding 5: Low uptime
  if (sortedUp.length && sortedUp[0].up < 90) {
    html += renderFinding('amber', `${sortedUp[0].name} tiene el uptime más bajo (${sortedUp[0].up}%), lo que reduce capacidad efectiva y genera paradas no planificadas. Revisar plan de mantenimiento preventivo.`);
  }
  
  html += `</div></div>`;
  
  // ── PRIORITIZED RECOMMENDATIONS ──
  html += `<div style="margin-top:20px;"><div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;">🎯 Recomendaciones priorizadas</div>`;
  html += `<div style="display:flex;flex-direction:column;gap:8px;">`;
  
  let recNum = 1;
  
  // Rec 1: Fix bottleneck
  if (bottlenecks.length) {
    const bn = bottlenecks[0];
    const upBn = parseFloat(bn.uptime);
    const coBn = parseFloat(bn.co);
    let action = '';
    if (upBn && upBn < 90) action = `Mejorar uptime de ${bn.name} (actual ${upBn}%) mediante mantenimiento preventivo y análisis de paradas.`;
    else if (coBn && coBn > 15) action = `Reducir tiempo de cambio en ${bn.name} (actual ${coBn} min) mediante proyecto SMED para recuperar capacidad.`;
    else action = `Analizar y resolver la restricción de capacidad en ${bn.name} (C/T efectivo ${bn.ctEff.toFixed(2)} seg vs takt ${takt.toFixed(2)} seg).`;
    html += renderRec(recNum++, action, 'Primero — sin capacidad en el cuello de botella, cualquier otra mejora acumula más inventario');
  }
  
  // Rec 2: SMED on highest C/O
  if (sortedCO.length && sortedCO[0].co > 15) {
    html += renderRec(recNum++, `Proyecto SMED en ${sortedCO[0].name} para reducir C/O de ${sortedCO[0].co} min. Objetivo: reducir tamaño de lote y bajar WIP entre procesos.`, 'Reducir lotes ataca directamente el inventario en proceso y el lead time');
  }
  
  // Rec 3: Reduce biggest NVA point
  if (nvaBreakdown.length) {
    const top = nvaBreakdown[0];
    html += renderRec(recNum++, `Reducir inventario en ${top.name} (${formatTime(top.seconds)}, ${top.pct.toFixed(1)}% del lead time). Revisar política de aprovisionamiento o lógica de lotes que genera esta acumulación.`, 'El mayor contribuyente al lead time total');
  }
  
  // Rec 4: Implement pull
  html += renderRec(recNum++, `Evolucionar de sistema push (programa semanal a cada proceso) a sistema pull con señales kanban entre procesos, empezando por el cuello de botella aguas abajo.`, 'El flujo de información push genera sobreproducción en cada etapa');
  
  html += `</div></div>`;
  
  el.innerHTML = html;
}

function renderFinding(color, text) {
  const colors = { red: 'var(--red)', amber: 'var(--amber)', green: 'var(--green)' };
  const bgs = { red: 'rgba(226,75,74,0.06)', amber: 'rgba(186,117,23,0.06)', green: 'rgba(29,158,117,0.06)' };
  return `<div style="padding:10px 14px;background:${bgs[color]};border-left:3px solid ${colors[color]};border-radius:0 var(--r-sm) var(--r-sm) 0;">
    <div style="font-size:12px;color:var(--text);line-height:1.5;">${text}</div>
  </div>`;
}

function renderRec(num, text, rationale) {
  return `<div style="padding:12px 14px;background:var(--s2);border:0.5px solid var(--border);border-radius:var(--r-sm);display:flex;gap:12px;align-items:flex-start;">
    <div style="width:24px;height:24px;border-radius:50%;background:rgba(0,173,181,0.15);border:1px solid var(--teal);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--teal-l);flex-shrink:0;">${num}</div>
    <div><div style="font-size:12px;color:var(--text);line-height:1.5;">${text}</div>
    <div style="font-size:10px;color:var(--text3);margin-top:4px;font-style:italic;">↳ ${rationale}</div></div>
  </div>`;
}

// ── VSM CONTEXT FOR DIOP REPORT ──
function getVSMReportContext() {
  if (!currentClient) return '';
  const vsm = vsmData[currentClient.id];
  if (!vsm || !vsm.processes || !vsm.processes.length) return '';
  
  const takt = calcTaktTime(vsm);
  const procs = vsm.processes;
  
  let totalVA = 0;
  procs.forEach(p => { const ct = normalizeCT(p); if (ct) totalVA += ct; });
  
  let totalNVA = 0;
  const mpDays = parseFloat(vsm.inventories.mp);
  if (mpDays) totalNVA += mpDays * 24 * 3600;
  for (let i = 0; i < procs.length - 1; i++) {
    const key = `${i}_${i+1}`;
    const wip = parseFloat(vsm.inventories.between?.[key]);
    const nextCT = normalizeCT(procs[i+1]);
    if (wip && nextCT) totalNVA += wip * nextCT;
  }
  const ptUnits = parseFloat(vsm.inventories.pt);
  const demandDay = parseFloat(vsm.demand.units_per_day);
  if (ptUnits && demandDay) totalNVA += (ptUnits / demandDay) * 24 * 3600;
  
  const leadTime = totalVA + totalNVA;
  const vaRatio = leadTime > 0 ? (totalVA / leadTime) * 100 : 0;
  
  const bottlenecks = procs.filter(p => { const eff = effectiveCT(p); return takt && eff && eff > takt; });
  
  let ctx = '\n=== VALUE STREAM MAP (ANÁLISIS DE FLUJO) ===\n';
  ctx += `Familia de producto mapeada: ${vsm.client_info.name || 'No especificada'}\n`;
  ctx += `Demanda: ${vsm.demand.units_per_day || '?'} uds/día\n`;
  ctx += `Takt Time: ${takt ? takt.toFixed(2) + ' seg/ud' : 'No calculado'}\n`;
  ctx += `Lead Time total: ${formatTime(leadTime)}\n`;
  ctx += `Tiempo de valor añadido: ${formatTime(totalVA)}\n`;
  ctx += `Ratio de valor añadido: ${vaRatio > 0 ? vaRatio.toFixed(4) + '%' : 'No calculado'}\n`;
  ctx += `\nProcesos mapeados:\n`;
  procs.forEach((p, i) => {
    const ct = normalizeCT(p); const eff = effectiveCT(p);
    const isBot = takt && eff && eff > takt;
    ctx += `  ${i+1}. ${p.name||'?'} — C/T: ${ct ? ct.toFixed(2)+'seg' : '?'}, C/O: ${p.co||'?'}min, Uptime: ${p.uptime||'?'}%${isBot ? ' [CUELLO DE BOTELLA]' : ''}\n`;
  });
  if (bottlenecks.length) {
    ctx += `\nCuellos de botella: ${bottlenecks.map(b => b.name||'?').join(', ')}\n`;
  }
  ctx += `Almacén MP: ${vsm.inventories.mp||'?'} días\n`;
  ctx += `Almacén PT: ${vsm.inventories.pt||'?'} uds${demandDay ? ' (' + (ptUnits/demandDay).toFixed(1) + ' días)' : ''}\n`;
  ctx += `Sistema de planificación: ${vsm.planning.type||'?'} — programa ${vsm.planning.frequency||'?'}\n`;
  
  return ctx;
}
