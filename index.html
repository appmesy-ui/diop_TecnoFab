    </div>`;
  });
  html+=`</div></div>`;
  
  html+=renderConfidenceLayer();
  
  document.getElementById('m5-content').innerHTML=html;
}

function generateSuggestions(currentBacklog){
  if(!currentClient)return[];
  const sug=[];
  const already=new Set(currentBacklog.map(b=>b.name));
  const add=(name,reason)=>{if(already.has(name))return;const cat=getFullCatalogue().find(c=>c.name===name);if(cat)sug.push({...cat,reason});};
  
  const a=(sid,qid)=>allAnswers[`${currentClient.id}_${sid}_${qid}`]||'';
  const m2=m2extData[currentClient.id];
  const m3=m3extData[currentClient.id];
  const m4=m4Data[currentClient.id];
  
  // ── From maintenance data ──
  const mt=a('fab','maintenance_type_pct');
  if(mt.includes('Casi todo reactivo')||mt.includes('Mayoría reactivo')){
    add('PM básico en equipos críticos','Mantenimiento mayoritariamente reactivo detectado en M2');
  }
  
  // ── From 5S ──
  if(m2&&m2.fiveS){
    const dims=['seiri','seiton','seiso','seiketsu','shitsuke'];
    const vals=dims.map(k=>parseInt(m2.fiveS[k])||0).filter(v=>v>0);
    if(vals.length){
      const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
      if(avg<2.5)add('5S en área de producción','Score 5S = '+avg.toFixed(1)+'/5 — por debajo del umbral 2.5');
    }
  }
  
  // ── From loss tree ──
  if(m2&&m2.losses){
    if(parseFloat(m2.losses.changeover)>15)add('SMED básico — reducción de changeover','Changeover = '+m2.losses.changeover+'% de las pérdidas');
    if(parseFloat(m2.losses.averia)>20)add('PM básico en equipos críticos','Averías = '+m2.losses.averia+'% de las pérdidas');
  }
  
  // ── From OEE ──
  const oee=a('fab','oee_current');
  if(oee.includes('No lo saben'))add('Cálculo OEE automatizado','OEE no medido — sin baseline de rendimiento');
  else if(oee.includes('menos del 50')||oee.includes('50% - 65'))add('Cálculo OEE automatizado','OEE bajo — necesita medición fiable para mejorar');
  
  // ── From downtime capture ──
  const dc=a('sys','downtime_capture');
  if(dc.includes('mano')||dc.includes('No se'))add('Captura de paros por línea','Paros no se capturan automáticamente');
  
  // ── From production report ──
  const pr=a('sys','production_report');
  if(pr&&(pr.includes('Papel')||pr.includes('Excel')))add('Registro digital de producción por turno','Parte de producción en papel/Excel');
  
  // ── From ERP ──
  const erp=a('sys','erp_system');
  if(erp.includes('No tienen'))add('Gestión visual de producción (tablero de turno)','Sin ERP — empezar por visibilidad básica');
  
  // ── From traceability ──
  const lt=a('sys','lot_tracking');
  if(lt&&(lt.includes('No hay')||lt.includes('parcial')))add('Trazabilidad de lotes (MP → PT)','Trazabilidad inexistente o parcial');
  
  // ── From warehouse ──
  const wh=a('sys','warehouse_management');
  if(wh&&(wh.includes('Excel')||wh.includes('Papel')||wh.includes('Sin sistema')))add('Registro digital de producción por turno','Gestión almacén sin sistema formal');
  
  // ── From cybersecurity ──
  if(m3&&m3.cyber){
    if(m3.cyber.net_separation==='No')add('Segmentación red OT/IT','Redes OT/IT no separadas — riesgo crítico');
  }
  
  // ── From digital maturity ──
  if(m3&&m3.digital_dims){
    const prodDim=parseInt(m3.digital_dims.produccion)||0;
    if(prodDim>=3)add('Dashboard operativo en tiempo real','Madurez producción nivel '+prodDim+' — listo para dashboard RT');
    const maintDim=parseInt(m3.digital_dims.mantenimiento)||0;
    if(maintDim<=2)add('Registro digital de mantenimiento (GMAO)','Madurez mantenimiento nivel '+maintDim+' — necesita GMAO');
  }
  
  // ── From M4 readiness ──
  if(m4&&m4.dimensions){
    if((m4.dimensions.ownership||0)<=2)add('Ownership de KPIs por proceso','Ownership organizacional score ≤2');
    if((m4.dimensions.sponsor||0)<=2&&(m4.dimensions.collaboration||0)<=2)add('Rutinas de gestión operativa (reuniones tier)','Sponsor pasivo + silos — necesita governance básica');
  }
  
  // ── From VSM ──
  const vsm=vsmData[currentClient.id];
  if(vsm&&vsm.processes&&vsm.processes.length){
    const procs=vsm.processes;
    const highCO=procs.filter(p=>parseFloat(p.co)>20).sort((a,b)=>parseFloat(b.co)-parseFloat(a.co));
    if(highCO.length)add('SMED básico — reducción de changeover','VSM: '+highCO[0].name+' tiene C/O de '+highCO[0].co+' min');
  }
  
  // ── From root cause ──
  if(m2&&m2.rootCause){
    m2.rootCause.forEach(rc=>{
      if(rc.initiative&&rc.ttl&&!already.has(rc.initiative)){
        sug.push({layer:rc.ttl,name:rc.initiative,desc:'Iniciativa de causa raíz',cat:'A',ttm:'TBD',reason:'Causa raíz: "'+rc.desc?.substring(0,50)+'..."'});
      }
    });
  }
  
  return sug;
}

function confidenceBandFromScore(v){return v>=4?'Alta':v>=3?'Media':v>0?'Baja':'Pendiente';}
function calcPortfolioEconomics(backlog){
  const list=(backlog||[]).filter(b=>b.investment>0&&(b.savings>0||b.savings_low>0||b.savings_high>0));
  const totalInv=list.reduce((a,b)=>a+(Number(b.investment)||0),0);
  const totalLow=list.reduce((a,b)=>a+(Number(b.savings_low)||0),0);
  const totalBase=list.reduce((a,b)=>a+(Number(b.savings)||0),0);
  const totalHigh=list.reduce((a,b)=>a+(Number(b.savings_high)||0),0);
  const confs=list.map(b=>Number(b.confidence)||0).filter(Boolean);
  const avgConf=confs.length?Math.round(confs.reduce((a,b)=>a+b,0)/confs.length*10)/10:0;
  const riskCount=(backlog||[]).filter(b=>b.cat==='D').length;
  return {list,totalInv,totalLow,totalBase,totalHigh,avgConf,confidenceBand:confidenceBandFromScore(avgConf),paybackLow:totalLow?Math.round(totalInv/totalLow*12):0,paybackBase:totalBase?Math.round(totalInv/totalBase*12):0,paybackHigh:totalHigh?Math.round(totalInv/totalHigh*12):0,riskCount};
}

function getTTLColor(layer){const c={'L1':'#E24B4A','L2':'#F59E0B','L3':'#3B82F6','L4':'#8B5CF6','L5':'#06B6D4','L6':'#10B981'};return c[layer]||'#6B7280';}
function getRIMZone(impact,readiness){if(impact>=7&&readiness>=7)return{zone:'LANZAR AHORA',col:'var(--green)',bg:'rgba(16,185,129,0.1)'};if(impact>=7&&readiness>=4)return{zone:'PREPARAR',col:'var(--amber)',bg:'rgba(245,158,11,0.1)'};if(impact>=4&&readiness>=7)return{zone:'LANZAR AHORA',col:'var(--green)',bg:'rgba(16,185,129,0.1)'};if(impact>=4&&readiness>=4)return{zone:'PREPARAR',col:'var(--teal)',bg:'rgba(0,173,181,0.1)'};if(impact>=7)return{zone:'VISIÓN',col:'var(--blue)',bg:'rgba(59,130,246,0.1)'};if(impact<4&&readiness<4)return{zone:'DESCARTAR',col:'var(--red)',bg:'rgba(226,75,74,0.1)'};return{zone:'EVALUAR',col:'var(--text3)',bg:'var(--s2)'};}

function filterCatalogue(layer){
  const cat=getFullCatalogue();
  const backlog=getM6().backlog||[];
  const backlogNames=backlog.map(b=>b.name);
  const filtered=layer==='all'?cat:cat.filter(c=>c.layer===layer);
  const el=document.getElementById('catalogue-list');
  if(!el)return;
  
  const ofi=Math.round(calcOFI_D1()*0.30+calcOFI_D2()*0.25+calcOFI_D3()*0.25+calcOFI_D4()*0.20);
  const clientTTL=ofi<15?'L1':ofi<30?'L2':ofi<45?'L3':ofi<60?'L4':ofi<75?'L5':'L6';
  
  el.innerHTML=filtered.map(c=>{
    const inBacklog=backlogNames.includes(c.name);
    const blocked=parseInt(c.layer.replace('L',''))>parseInt(clientTTL.replace('L',''));
    const ttlCol=getTTLColor(c.layer);
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--s2);border-radius:var(--r-sm);border:0.5px solid var(--border);${blocked?'opacity:0.5;':''}">
      <span style="padding:2px 6px;background:${ttlCol}22;color:${ttlCol};border-radius:8px;font-size:9px;font-weight:700;flex-shrink:0;">${c.layer}</span>
      <div style="flex:1;min-width:0;">
        <div style="font-size:11px;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${c.name}</div>
        <div style="font-size:9px;color:var(--text4);">${c.ttm||''}</div>
      </div>
      ${inBacklog?'<span style="font-size:9px;color:var(--teal);">✓ añadida</span>':`<button onclick="addToBacklog('${c.name.replace(/'/g,"\\'")}')" style="padding:4px 10px;background:rgba(0,173,181,0.1);border:1px solid var(--teal);color:var(--teal);border-radius:var(--r-xs);font-size:10px;cursor:pointer;flex-shrink:0;font-family:var(--font);">+ Añadir</button>`}
    </div>`;
  }).join('');
}

function addToBacklog(name){
  const cat=getFullCatalogue();
  const item=cat.find(c=>c.name===name);
  if(!item)return;
  const m=getM6();
  if(m.backlog.some(b=>b.name===name))return;
  m.backlog.push({name:item.name,desc:item.desc,layer:item.layer,cat:item.cat,ttm:item.ttm,impact:0,readiness:0,investment:0,savings:0});
  renderM6();m6Changed();
}

function removeFromBacklog(idx){
  getM6().backlog.splice(idx,1);renderM6();m6Changed();
}

function showAddCustom(){document.getElementById('custom-form').style.display='block';}

function addCustomInitiative(){
  const layer=document.getElementById('custom-layer').value;
  const name=document.getElementById('custom-name').value.trim();
  const desc=document.getElementById('custom-desc').value.trim();
  if(!name)return;
  const m=getM6();
  if(!m.custom_catalogue)m.custom_catalogue=[];
  const item={layer,name,desc,cat:'A',ttm:'TBD',custom:true};
  m.custom_catalogue.push(item);
  m.backlog.push({...item,impact:0,readiness:0,investment:0,savings:0});
  document.getElementById('custom-form').style.display='none';
  document.getElementById('custom-name').value='';
  document.getElementById('custom-desc').value='';
  renderM6();m6Changed();
}

function renderRIMMatrix(backlog){
  const el=document.getElementById('rim-matrix');
  if(!el)return;
  const scored=backlog.filter(b=>b.impact&&b.readiness);
  
  // 3x3 grid: rows=impact(high,med,low), cols=readiness(low,med,high)
  const zones=[
    [{label:'VISIÓN',col:'#3B82F6'},{label:'PREPARAR',col:'#F59E0B'},{label:'LANZAR',col:'#10B981'}],
    [{label:'EVALUAR',col:'#6B7280'},{label:'PREPARAR',col:'#00ADB5'},{label:'LANZAR',col:'#10B981'}],
    [{label:'DESCARTAR',col:'#E24B4A'},{label:'EVALUAR',col:'#6B7280'},{label:'EVALUAR',col:'#6B7280'}]
  ];
  
  let h=`<div style="display:grid;grid-template-columns:30px repeat(3,1fr);grid-template-rows:20px repeat(3,1fr);gap:4px;min-height:280px;">`;
  // Header row
  h+=`<div></div><div style="text-align:center;font-size:9px;color:var(--text4);">Readiness Baja</div><div style="text-align:center;font-size:9px;color:var(--text4);">Readiness Media</div><div style="text-align:center;font-size:9px;color:var(--text4);">Readiness Alta</div>`;
  
  const impactLabels=['Impacto Alto','Impacto Medio','Impacto Bajo'];
  for(let r=0;r<3;r++){
    // Row label
    h+=`<div style="writing-mode:vertical-lr;text-orientation:mixed;transform:rotate(180deg);font-size:9px;color:var(--text4);text-align:center;">${impactLabels[r]}</div>`;
    for(let c=0;c<3;c++){
      const z=zones[r][c];
      // Find initiatives in this cell
      const inCell=scored.filter(b=>{
        const impRow=b.impact>=7?0:b.impact>=4?1:2;
        const readCol=b.readiness<4?0:b.readiness<7?1:2;
        return impRow===r&&readCol===c;
      });
      h+=`<div style="background:${z.col}11;border:1px solid ${z.col}44;border-radius:var(--r-sm);padding:6px;position:relative;min-height:70px;">
        <div style="font-size:8px;color:${z.col};font-weight:700;margin-bottom:4px;">${z.label}</div>
        ${inCell.map(b=>`<div style="font-size:9px;color:var(--text);background:var(--s1);padding:3px 6px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${b.name}"><span style="color:${getTTLColor(b.layer)};font-weight:700;">${b.layer}</span> ${b.name.substring(0,25)}${b.name.length>25?'…':''}</div>`).join('')}
      </div>`;
    }
  }
  h+=`</div>`;
  el.innerHTML=h;
}

async function loadVSMData(clientId) {
  try {
    const key = `${clientId}_vsm_vsm_config`;
    if (allAnswers[key]) {
      vsmData[clientId] = JSON.parse(allAnswers[key]);
    } else {
      const { data } = await sb.from('diop_answers').select('answer').eq('client_id', clientId).eq('session', 'vsm').eq('question_id', 'vsm_config').single();
      if (data?.answer) { vsmData[clientId] = JSON.parse(data.answer); allAnswers[key] = data.answer; }
    }
  } catch(e) { /* no data yet */ }
}

async function saveVSMData() {
  if (!currentClient) return;
  const vsm = getVSM();
  const json = JSON.stringify(vsm);
  allAnswers[`${currentClient.id}_vsm_vsm_config`] = json;
  try {
    await sb.from('diop_answers').upsert({
      client_id: currentClient.id, session: 'vsm', question_id: 'vsm_config',
      answer: json, updated_at: new Date().toISOString()
    });
  } catch(e) { console.error('VSM save error', e); }
}

function scheduleVSMSave() {
  clearTimeout(vsmSaveTimer);
  vsmSaveTimer = setTimeout(saveVSMData, 800);
}

function vsmChanged() { renderVSMResults(); renderVSMDiagram(); renderVSMConclusions(); scheduleVSMSave(); renderSidebarRoadmap(); }

// ── TAKT TIME CALCULATION ──
function calcTaktTime(vsm) {
  const avail = parseFloat(vsm.demand.available_min) - parseFloat(vsm.demand.planned_stops || 0);
  const demand = parseFloat(vsm.demand.units_per_day);
  if (!avail || !demand || avail <= 0 || demand <= 0) return null;
  return (avail * 60) / demand; // seconds per unit
}

// ── NORMALIZE C/T ──
function normalizeCT(proc) {
  const ct = parseFloat(proc.ct_value);
  if (!ct || ct <= 0) return null;
  const batch = parseFloat(proc.batch_size);
  const unit = proc.ct_unit || 'seg/ud';
  let ct_sec = ct;
  if (unit === 'min/batch' || unit === 'h/batch') {
    if (!batch || batch <= 0) return null;
    ct_sec = unit === 'h/batch' ? (ct * 3600) / batch : (ct * 60) / batch;
  } else if (unit === 'min/ud') {
    ct_sec = ct * 60;
  }
  return ct_sec;
}

function effectiveCT(proc) {
  const ct = normalizeCT(proc);
  if (!ct) return null;
  const up = parseFloat(proc.uptime);
  if (!up || up <= 0) return ct;
  return ct / (up / 100);
}

// ── INVENTORY TO TIME ──
function invToTime(wip, nextCT_sec) {
  const w = parseFloat(wip);
  if (!w || !nextCT_sec) return null;
  return w * nextCT_sec; // seconds
}

function formatTime(seconds) {
  if (seconds === null || isNaN(seconds)) return '—';
  if (seconds < 60) return seconds.toFixed(1) + ' seg';
  if (seconds < 3600) return (seconds / 60).toFixed(1) + ' min';
  if (seconds < 86400) return (seconds / 3600).toFixed(2) + ' h';
  return (seconds / 86400).toFixed(1) + ' días';
}

function formatTimeShort(seconds) {
  if (seconds === null || isNaN(seconds)) return '—';
  if (seconds < 3600) return (seconds / 60).toFixed(0) + 'm';
  if (seconds < 86400) return (seconds / 3600).toFixed(1) + 'h';
  return (seconds / 86400).toFixed(1) + 'd';
}

function renderProcessCard(proc, idx, takt) {
  const ctNorm = normalizeCT(proc);
  const ctEff = effectiveCT(proc);
  const isBottleneck = takt && ctEff && ctEff > takt;
  const needsBatch = proc.ct_unit === 'min/batch' || proc.ct_unit === 'h/batch';

  return `<div class="vsm-proc-card ${isBottleneck ? 'is-bottleneck' : ''}">
    <div class="vsm-proc-header">
      <input class="vsm-proc-name-input" placeholder="Nombre del proceso" value="${proc.name||''}" oninput="getVSM().processes[${idx}].name=this.value;vsmChanged()">
      <button class="vsm-proc-del" onclick="removeProcess(${idx})" title="Eliminar">✕</button>
    </div>
    <div class="vsm-proc-grid">
      <div class="vsm-proc-metric">
        <span>C/T (valor)</span>
        <input type="number" step="any" value="${proc.ct_value||''}" placeholder="0" oninput="getVSM().processes[${idx}].ct_value=this.value;renderVSM()">
      </div>
      <div class="vsm-proc-metric">
        <span>C/T (unidad)</span>
        <select class="vsm-select" style="padding:5px 7px;font-size:12px;" onchange="getVSM().processes[${idx}].ct_unit=this.value;renderVSM()">
          <option value="seg/ud" ${proc.ct_unit==='seg/ud'?'selected':''}>seg/ud</option>
          <option value="min/ud" ${proc.ct_unit==='min/ud'?'selected':''}>min/ud</option>
          <option value="min/batch" ${proc.ct_unit==='min/batch'?'selected':''}>min/batch</option>
          <option value="h/batch" ${proc.ct_unit==='h/batch'?'selected':''}>h/batch</option>
        </select>
      </div>
      ${needsBatch ? `<div class="vsm-proc-metric">
        <span>Batch size (uds)</span>
        <input type="number" value="${proc.batch_size||''}" placeholder="0" oninput="getVSM().processes[${idx}].batch_size=this.value;renderVSM()">
      </div>` : ''}
      <div class="vsm-proc-metric">
        <span>C/O (min)</span>
        <input type="number" step="any" value="${proc.co||''}" placeholder="0" oninput="getVSM().processes[${idx}].co=this.value;vsmChanged()">
      </div>
      <div class="vsm-proc-metric">
        <span>Uptime (%)</span>
        <input type="number" step="any" value="${proc.uptime||''}" placeholder="100" oninput="getVSM().processes[${idx}].uptime=this.value;renderVSM()">
      </div>
      <div class="vsm-proc-metric">
        <span>Operadores</span>
        <input type="number" value="${proc.operators||''}" placeholder="1" oninput="getVSM().processes[${idx}].operators=this.value;vsmChanged()">
      </div>
    </div>
    ${ctNorm !== null ? `<div class="vsm-proc-ct-norm ${isBottleneck ? 'bottleneck' : ''}">C/T: ${ctNorm.toFixed(2)} seg/ud${ctEff && ctEff !== ctNorm ? ` · Efectivo: ${ctEff.toFixed(2)} seg/ud` : ''}${isBottleneck ? ' ⚠ CUELLO DE BOTELLA' : ''}</div>` : ''}
  </div>`;
}

function renderInventories(vsm) {
  let html = '';
  const procs = vsm.processes;
  
  // MP inventory
  html += `<div class="vsm-inv-row">
    <div class="vsm-inv-label">📦 Almacén MP</div>
    <input class="vsm-inv-input" type="number" step="any" placeholder="0" value="${vsm.inventories.mp||''}" oninput="getVSM().inventories.mp=this.value;vsmChanged()">
    <span style="font-size:11px;color:var(--text3);width:50px;">días</span>
    <div class="vsm-inv-time">${vsm.inventories.mp ? (parseFloat(vsm.inventories.mp)*24).toFixed(1) + ' h' : '—'}</div>
  </div>`;
  
  // Between processes
  for (let i = 0; i < procs.length - 1; i++) {
    const key = `${i}_${i+1}`;
    const wip = vsm.inventories.between?.[key] || '';
    const nextCT = normalizeCT(procs[i+1]);
    const timeS = invToTime(wip, nextCT);
    html += `<div class="vsm-inv-row">
      <div class="vsm-inv-label">▸ ${procs[i].name || '?'} → ${procs[i+1].name || '?'}</div>
      <input class="vsm-inv-input" type="number" placeholder="0" value="${wip}" oninput="if(!getVSM().inventories.between)getVSM().inventories.between={};getVSM().inventories.between['${key}']=this.value;vsmChanged()">
      <span style="font-size:11px;color:var(--text3);width:50px;">uds</span>
      <div class="vsm-inv-time">${timeS !== null ? formatTime(timeS) : '—'}</div>
    </div>`;
  }
  
  // PT inventory
  const demandDay = parseFloat(vsm.demand.units_per_day);
  const ptDays = demandDay ? parseFloat(vsm.inventories.pt) / demandDay : null;
  html += `<div class="vsm-inv-row">
    <div class="vsm-inv-label">🏭 Almacén PT</div>
    <input class="vsm-inv-input" type="number" placeholder="0" value="${vsm.inventories.pt||''}" oninput="getVSM().inventories.pt=this.value;vsmChanged()">
    <span style="font-size:11px;color:var(--text3);width:50px;">uds</span>
    <div class="vsm-inv-time">${ptDays !== null && !isNaN(ptDays) ? ptDays.toFixed(1) + ' días' : '—'}</div>
  </div>`;
  
  return html;
}

function removeProcess(idx) {
  const vsm = getVSM();
  vsm.processes.splice(idx, 1);
  // Clean up inventories between
  const newBetween = {};
  for (let i = 0; i < vsm.processes.length - 1; i++) {
    const oldKey = Object.keys(vsm.inventories.between || {}).find(k => {
      const parts = k.split('_');
      return parseInt(parts[0]) === i || parseInt(parts[0]) === i + 1;

    // Reset - user will need to re-enter

// ── RESULTS ──
function renderVSMResults() {
  const vsm = getVSM();
  const el = document.getElementById('vsm-results');
  if (!el) return;
  
  const takt = calcTaktTime(vsm);
  const procs = vsm.processes;
  if (!procs.length) { el.innerHTML = '<div style="color:var(--text4);font-size:12px;">Añade procesos para ver resultados</div>'; return; }
  
  // Total VA
  let totalVA = 0;
  procs.forEach(p => { const ct = normalizeCT(p); if (ct) totalVA += ct; });
  
  // Total NVA
  let totalNVA = 0;
  // MP
  const mpDays = parseFloat(vsm.inventories.mp);
  if (mpDays) totalNVA += mpDays * 24 * 3600;
  // Between
  for (let i = 0; i < procs.length - 1; i++) {
    const key = `${i}_${i+1}`;
    const wip = parseFloat(vsm.inventories.between?.[key]);
    const nextCT = normalizeCT(procs[i+1]);
    if (wip && nextCT) totalNVA += wip * nextCT;
  }
  // PT
  const ptUnits = parseFloat(vsm.inventories.pt);
  const demandDay = parseFloat(vsm.demand.units_per_day);
  if (ptUnits && demandDay) totalNVA += (ptUnits / demandDay) * 24 * 3600;
  
  const leadTime = totalVA + totalNVA;
  const vaRatio = leadTime > 0 ? (totalVA / leadTime) * 100 : 0;
  
  // Bottlenecks
  const bottlenecks = procs.filter(p => { const eff = effectiveCT(p); return takt && eff && eff > takt; });
  
  el.innerHTML = `
    <div class="vsm-results-grid" style="margin-top:12px;">
      <div class="vsm-result-card">
        <div class="vsm-result-val">${takt ? takt.toFixed(2) : '—'}</div>
        <div class="vsm-result-label">Takt Time (seg)</div>
      </div>
      <div class="vsm-result-card">
        <div class="vsm-result-val">${formatTime(totalVA)}</div>
        <div class="vsm-result-label">Valor Añadido</div>
      </div>
      <div class="vsm-result-card">
        <div class="vsm-result-val">${formatTime(leadTime)}</div>
        <div class="vsm-result-label">Lead Time Total</div>
      </div>
      <div class="vsm-result-card">
        <div class="vsm-result-val ${vaRatio < 1 ? 'bad' : vaRatio < 5 ? 'warn' : ''}">${vaRatio > 0 ? vaRatio.toFixed(4) + '%' : '—'}</div>
        <div class="vsm-result-label">Ratio VA</div>
      </div>
    </div>
    ${bottlenecks.length ? `<div style="margin-top:12px;padding:10px 14px;background:rgba(226,75,74,0.06);border:0.5px solid rgba(226,75,74,0.2);border-radius:var(--r-sm);">
      <div style="font-size:12px;font-weight:600;color:var(--red);margin-bottom:4px;">⚠ Cuellos de botella detectados</div>
      ${bottlenecks.map(b => `<div style="font-size:11px;color:var(--text2);margin-top:2px;">• <strong>${b.name||'Sin nombre'}</strong> — C/T efectivo: ${effectiveCT(b).toFixed(2)} seg/ud (takt: ${takt.toFixed(2)})</div>`).join('')}
    </div>` : ''}
  `;
}

// ── SVG DIAGRAM ──
function renderVSMDiagram() {
  const vsm = getVSM();
  const el = document.getElementById('vsm-diagram');
  if (!el) return;
  
  const procs = vsm.processes;
  if (!procs.length) { el.innerHTML = '<div style="color:var(--text4);font-size:12px;text-align:center;padding:40px;">Añade procesos para generar el diagrama</div>'; return; }
  
  const takt = calcTaktTime(vsm);
  const n = procs.length;
  const procW = 100, procH = 40, dataH = 65, gap = 60;
  const marginL = 120, marginR = 120, marginTop = 90, procY = 150;
  const totalW = marginL + n * procW + (n - 1) * gap + marginR;
  const totalH = procY + procH + dataH + 120;
  
  let svg = `<svg viewBox="0 0 ${totalW} ${totalH}" xmlns="http://www.w3.org/2000/svg" style="font-family:'DM Sans',sans-serif;">`;
  
  // Background
  svg += `<rect width="${totalW}" height="${totalH}" fill="transparent"/>`;
  
  // Colors
  const cBg = '#0f1a2e', cBorder = '#1a3a4a', cText = '#e8f4f5', cText2 = '#7ab0b8', cText3 = '#3a7a82', cTeal = '#00adb5', cRed = '#E24B4A';
  
  // ── SUPPLIER (top left) ──
  const supX = 20, supY = 15;
  svg += `<rect x="${supX}" y="${supY}" width="80" height="40" fill="${cBg}" stroke="${cBorder}" stroke-width="1" rx="3"/>`;
  svg += `<polygon points="${supX+25},${supY} ${supX+55},${supY} ${supX+40},${supY-15}" fill="${cBg}" stroke="${cBorder}" stroke-width="1"/>`;
  svg += `<text x="${supX+40}" y="${supY+25}" text-anchor="middle" fill="${cText2}" font-size="8" font-weight="600">${vsm.supplier.name||'Proveedor'}</text>`;
  
  // ── CLIENT (top right) ──
  const cliX = totalW - 100, cliY = 15;
  svg += `<rect x="${cliX}" y="${cliY}" width="80" height="40" fill="${cBg}" stroke="${cBorder}" stroke-width="1" rx="3"/>`;
  svg += `<polygon points="${cliX+25},${cliY} ${cliX+55},${cliY} ${cliX+40},${cliY-15}" fill="${cBg}" stroke="${cBorder}" stroke-width="1"/>`;
  svg += `<text x="${cliX+40}" y="${cliY+20}" text-anchor="middle" fill="${cText2}" font-size="8" font-weight="600">${vsm.client_info.name||'Cliente'}</text>`;
  svg += `<text x="${cliX+40}" y="${cliY+32}" text-anchor="middle" fill="${cText3}" font-size="6">${vsm.demand.units_per_day||'?'} uds/día</text>`;
  
  // ── PLANNING (top center) ──
  const planX = totalW / 2 - 60, planY = 8;
  svg += `<rect x="${planX}" y="${planY}" width="120" height="32" fill="${cBg}" stroke="${cTeal}" stroke-width="1" rx="3"/>`;

  // ── INFO ARROWS ──
  // Client → Planning
  svg += `<line x1="${cliX}" y1="${cliY+20}" x2="${planX+120}" y2="${planY+16}" stroke="${cText3}" stroke-width="0.8" stroke-dasharray="4,2" marker-end="url(#arrowInfo)"/>`;
  svg += `<text x="${(cliX+planX+120)/2}" y="${cliY+10}" text-anchor="middle" fill="${cText3}" font-size="5.5">Pedidos</text>`;
  
  // Planning → Supplier
  svg += `<line x1="${planX}" y1="${planY+16}" x2="${supX+80}" y2="${supY+20}" stroke="${cText3}" stroke-width="0.8" stroke-dasharray="4,2" marker-end="url(#arrowInfo)"/>`;
  svg += `<text x="${(planX+supX+80)/2}" y="${supY+10}" text-anchor="middle" fill="${cText3}" font-size="5.5">Pedido MP</text>`;

  });

  // Arrow defs
  svg += `<defs>
    <marker id="arrowInfo" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="${cText3}"/>
    </marker>
    <marker id="arrowFlow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="${cTeal}"/>
    </marker>
  </defs>`;
  
  // ── MP INVENTORY ──
  const mpX = marginL - 50, mpY = procY + procH / 2;
  if (vsm.inventories.mp) {
    svg += drawTriangle(mpX - 20, mpY - 10, `${vsm.inventories.mp}d`, cText2, cBorder);
  }
  
  // ── PROCESSES + DATA BOXES ──
  procs.forEach((p, i) => {
    const px = marginL + i * (procW + gap);
    const ctEff = effectiveCT(p);
    const isBot = takt && ctEff && ctEff > takt;
    const borderC = isBot ? cRed : cBorder;
    
    // Process box
    svg += `<rect x="${px}" y="${procY}" width="${procW}" height="${procH}" fill="${cBg}" stroke="${borderC}" stroke-width="${isBot?1.5:1}" rx="2"/>`;
    svg += `<text x="${px+procW/2}" y="${procY+procH/2+4}" text-anchor="middle" fill="${cText}" font-size="8" font-weight="600">${p.name||'Proceso '+(i+1)}</text>`;
    
    // Data box
    const dy = procY + procH;
    svg += `<rect x="${px}" y="${dy}" width="${procW}" height="${dataH}" fill="${cBg}" stroke="${borderC}" stroke-width="0.5" rx="2"/>`;
    const ctNorm = normalizeCT(p);
    const lines = [
      `C/T: ${ctNorm !== null ? ctNorm.toFixed(2)+' s' : '—'}`,
      `C/O: ${p.co||'—'} min`,
      `Up: ${p.uptime||'—'}%`,
      `Op: ${p.operators||'—'}`
    ];
    lines.forEach((l, li) => {
      svg += `<text x="${px+6}" y="${dy+12+li*13}" fill="${cText3}" font-size="6.5" font-family="'DM Mono',monospace">${l}</text>`;
    });
    if (isBot) {
      svg += `<text x="${px+procW/2}" y="${dy+dataH+12}" text-anchor="middle" fill="${cRed}" font-size="6" font-weight="600">⚠ CUELLO DE BOTELLA</text>`;
    }
    
    // Flow arrow to next process
    if (i < n - 1) {
      svg += `<line x1="${px+procW}" y1="${procY+procH/2}" x2="${px+procW+gap}" y2="${procY+procH/2}" stroke="${cTeal}" stroke-width="1.5" marker-end="url(#arrowFlow)"/>`;
    }
    
    // Inventory triangle between processes
    if (i < n - 1) {
      const key = `${i}_${i+1}`;
      const wip = vsm.inventories.between?.[key];
      if (wip) {
        const tx = px + procW + gap / 2;
        const nextCT = normalizeCT(procs[i+1]);
        const timeS = invToTime(wip, nextCT);
        svg += drawTriangle(tx - 12, procY + procH + 15, wip, cText2, cBorder);
        if (timeS !== null) {
          svg += `<text x="${tx}" y="${procY+procH+55}" text-anchor="middle" fill="${cTeal}" font-size="5.5" font-family="'DM Mono',monospace">${formatTimeShort(timeS)}</text>`;
        }
      }
    }
  });
  
  // ── PT INVENTORY ──
  const lastPx = marginL + (n - 1) * (procW + gap) + procW;
  if (vsm.inventories.pt) {
    const ptX = lastPx + 25;
    const demDay = parseFloat(vsm.demand.units_per_day);
    const ptD = demDay ? (parseFloat(vsm.inventories.pt) / demDay) : null;
    svg += drawTriangle(ptX, procY + procH / 2 - 10, vsm.inventories.pt, cText2, cBorder);
    if (ptD) svg += `<text x="${ptX+12}" y="${procY+procH/2+25}" text-anchor="middle" fill="${cTeal}" font-size="5.5" font-family="'DM Mono',monospace">${ptD.toFixed(1)}d</text>`;
  }
  
  // ── TIMELINE ──
  const tlY = procY + procH + dataH + 30;
  let totalVA = 0, totalNVA = 0;
  procs.forEach(p => { const ct = normalizeCT(p); if (ct) totalVA += ct; });
  
  const mpDays = parseFloat(vsm.inventories.mp);
  if (mpDays) totalNVA += mpDays * 24 * 3600;
  for (let i = 0; i < procs.length - 1; i++) {
    const key = `${i}_${i+1}`;
    const wip = parseFloat(vsm.inventories.between?.[key]);
    const nextCT = normalizeCT(procs[i+1]);
    if (wip && nextCT) totalNVA += wip * nextCT;
  }
  const ptUnits = parseFloat(vsm.inventories.pt);
  const demandDay = parseFloat(vsm.demand.units_per_day);
  if (ptUnits && demandDay) totalNVA += (ptUnits / demandDay) * 24 * 3600;
  
  const leadTime = totalVA + totalNVA;
  const vaRatio = leadTime > 0 ? (totalVA / leadTime) * 100 : 0;
  
  svg += `<line x1="20" y1="${tlY}" x2="${totalW-20}" y2="${tlY}" stroke="${cBorder}" stroke-width="0.5"/>`;
  svg += `<text x="20" y="${tlY+14}" fill="${cText3}" font-size="6">Lead Time: ${formatTime(leadTime)}</text>`;
  svg += `<text x="20" y="${tlY+24}" fill="${cText3}" font-size="6">VA: ${formatTime(totalVA)}  ·  Ratio: ${vaRatio > 0 ? vaRatio.toFixed(4)+'%' : '—'}</text>`;
  svg += `<text x="${totalW-20}" y="${tlY+14}" text-anchor="end" fill="${takt?cTeal:cText3}" font-size="6">Takt: ${takt?takt.toFixed(2)+' seg/ud':'—'}</text>`;
  
  svg += `</svg>`;
  el.innerHTML = svg;
}

function drawTriangle(x, y, label, textColor, strokeColor) {
  return `<polygon points="${x},${y+20} ${x+12},${y} ${x+24},${y+20}" fill="none" stroke="${strokeColor}" stroke-width="0.8"/>
    <text x="${x+12}" y="${y+32}" text-anchor="middle" fill="${textColor}" font-size="6" font-family="'DM Mono',monospace">${label}</text>`;
}

const VSM_BENCHMARKS = {
  'Alimentación y bebidas': { va_ratio: [0.5, 5], lead_time_days: [2, 15], uptime: [75, 92], co_min: [15, 45], label: 'Food & Beverage' },
  'Farmacéutico': { va_ratio: [0.2, 3], lead_time_days: [5, 30], uptime: [70, 90], co_min: [20, 60], label: 'Pharma' },
  'Cosmética y cuidado personal': { va_ratio: [0.5, 5], lead_time_days: [2, 12], uptime: [75, 90], co_min: [15, 40], label: 'Cosmética' },
  'Metal y componentes': { va_ratio: [1, 8], lead_time_days: [3, 20], uptime: [70, 88], co_min: [20, 60], label: 'Metal' },
  'Plástico y caucho': { va_ratio: [1, 10], lead_time_days: [1, 10], uptime: [75, 92], co_min: [15, 45], label: 'Plástico' },
  'Química': { va_ratio: [0.5, 5], lead_time_days: [3, 20], uptime: [72, 90], co_min: [30, 90], label: 'Química' },

};

// ── CONCLUSIONS ──
function renderVSMConclusions() {
  const el = document.getElementById('vsm-conclusions');
  if (!el) return;
  
  const vsm = getVSM();
  const procs = vsm.processes;
  if (!procs.length) { el.innerHTML = '<div style="color:var(--text4);font-size:12px;">Añade procesos y datos para generar conclusiones</div>'; return; }
  
  const takt = calcTaktTime(vsm);
  const sector = currentClient?.sector || '';
  const bench = VSM_BENCHMARKS[sector] || VSM_BENCHMARKS['default'];
  
  // Calculate all metrics
  let totalVA = 0;
  procs.forEach(p => { const ct = normalizeCT(p); if (ct) totalVA += ct; });
  
  let totalNVA = 0;
  const nvaBreakdown = [];
  
  const mpDays = parseFloat(vsm.inventories.mp);
  if (mpDays) { const s = mpDays * 24 * 3600; totalNVA += s; nvaBreakdown.push({ name: 'Almacén MP', seconds: s, pct: 0 }); }
  
  for (let i = 0; i < procs.length - 1; i++) {
    const key = `${i}_${i+1}`;
    const wip = parseFloat(vsm.inventories.between?.[key]);
    const nextCT = normalizeCT(procs[i+1]);
    if (wip && nextCT) { const s = wip * nextCT; totalNVA += s; nvaBreakdown.push({ name: `${procs[i].name||'?'} → ${procs[i+1].name||'?'}`, seconds: s, pct: 0 }); }
  }
  
  const ptUnits = parseFloat(vsm.inventories.pt);
  const demandDay = parseFloat(vsm.demand.units_per_day);
  if (ptUnits && demandDay) { const s = (ptUnits / demandDay) * 24 * 3600; totalNVA += s; nvaBreakdown.push({ name: 'Almacén PT', seconds: s, pct: 0 }); }
  
  const leadTime = totalVA + totalNVA;
  const vaRatio = leadTime > 0 ? (totalVA / leadTime) * 100 : 0;
  const leadTimeDays = leadTime / 86400;
  
  // Calculate percentages
  nvaBreakdown.forEach(n => n.pct = totalNVA > 0 ? (n.seconds / (totalNVA + totalVA)) * 100 : 0);
  nvaBreakdown.sort((a, b) => b.seconds - a.seconds);
  
  // Bottlenecks
  const bottlenecks = procs.map((p, i) => ({ ...p, idx: i, ctEff: effectiveCT(p), ctNorm: normalizeCT(p) })).filter(p => takt && p.ctEff && p.ctEff > takt);
  
  // Highest C/O
  const sortedCO = procs.map(p => ({ name: p.name, co: parseFloat(p.co) || 0 })).filter(p => p.co > 0).sort((a, b) => b.co - a.co);
  
  // Lowest uptime
  const sortedUp = procs.map(p => ({ name: p.name, up: parseFloat(p.uptime) || 100 })).sort((a, b) => a.up - b.up);
  
  let html = '';
  
  // ── BENCHMARK COMPARISON ──
  html += `<div style="margin-top:12px;"><div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;">📊 Benchmark sectorial — ${bench.label}</div>`;
  html += `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">`;
  
  const vaStatus = vaRatio <= bench.va_ratio[0] ? 'bad' : vaRatio <= bench.va_ratio[1] ? 'warn' : '';
  const ltStatus = leadTimeDays > bench.lead_time_days[1] ? 'bad' : leadTimeDays > bench.lead_time_days[0] ? 'warn' : '';
  const avgUp = procs.reduce((a, p) => a + (parseFloat(p.uptime) || 0), 0) / procs.length;
  const upStatus = avgUp < bench.uptime[0] ? 'bad' : avgUp < bench.uptime[1] ? 'warn' : '';
  const avgCO = sortedCO.length ? sortedCO.reduce((a, p) => a + p.co, 0) / sortedCO.length : 0;
  const coStatus = avgCO > bench.co_min[1] ? 'bad' : avgCO > bench.co_min[0] ? 'warn' : '';
  
  const benchItems = [
    { label: 'Ratio VA', value: vaRatio > 0 ? vaRatio.toFixed(4) + '%' : '—', bench: bench.va_ratio[0] + '–' + bench.va_ratio[1] + '%', status: vaStatus },
    { label: 'Lead Time', value: leadTimeDays > 0 ? leadTimeDays.toFixed(1) + ' días' : '—', bench: bench.lead_time_days[0] + '–' + bench.lead_time_days[1] + ' días', status: ltStatus },
    { label: 'Uptime medio', value: avgUp > 0 ? avgUp.toFixed(1) + '%' : '—', bench: bench.uptime[0] + '–' + bench.uptime[1] + '%', status: upStatus },
    { label: 'C/O medio', value: avgCO > 0 ? avgCO.toFixed(0) + ' min' : '—', bench: bench.co_min[0] + '–' + bench.co_min[1] + ' min', status: coStatus }
  ];
  
  benchItems.forEach(b => {
    const col = b.status === 'bad' ? 'var(--red)' : b.status === 'warn' ? 'var(--amber)' : 'var(--green)';
    html += `<div style="background:var(--s2);border:0.5px solid var(--border);border-radius:var(--r);padding:12px;text-align:center;">
      <div style="font-size:18px;font-weight:700;color:${col};font-family:var(--mono);">${b.value}</div>
      <div style="font-size:9px;color:var(--text3);margin-top:2px;text-transform:uppercase;">${b.label}</div>
      <div style="font-size:9px;color:var(--text3);margin-top:4px;padding-top:4px;border-top:0.5px solid var(--border);">Sector: ${b.bench}</div>
    </div>`;
  });
  html += `</div></div>`;
  
  // ── LEAD TIME BREAKDOWN ──
  if (nvaBreakdown.length) {
    html += `<div style="margin-top:20px;"><div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;">⏱️ Desglose del Lead Time — ¿Dónde se pierde el tiempo?</div>`;
    html += `<div style="display:flex;flex-direction:column;gap:6px;">`;
    nvaBreakdown.forEach(n => {
      const barW = Math.max(n.pct * 2, 4);
      html += `<div style="display:flex;align-items:center;gap:10px;">
        <div style="width:180px;font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${n.name}</div>
        <div style="flex:1;height:12px;background:var(--s1);border-radius:3px;overflow:hidden;">
          <div style="width:${barW}%;height:100%;background:${n.pct > 40 ? 'var(--red)' : n.pct > 20 ? 'var(--amber)' : 'var(--teal)'};border-radius:3px;"></div>
        </div>
        <div style="width:70px;text-align:right;font-size:11px;color:var(--text2);font-family:var(--mono);">${formatTime(n.seconds)}</div>
        <div style="width:45px;text-align:right;font-size:10px;color:var(--text3);font-family:var(--mono);">${n.pct.toFixed(1)}%</div>
      </div>`;
    });
    html += `</div></div>`;
  }
  
  // ── KEY FINDINGS ──
  html += `<div style="margin-top:20px;"><div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;">🔍 Hallazgos clave</div>`;
  html += `<div style="display:flex;flex-direction:column;gap:8px;">`;
  
  // Finding 1: VA ratio
  if (vaRatio > 0) {
    html += renderFinding('red', `El producto pasa ${leadTimeDays.toFixed(1)} días en planta pero solo se transforma durante ${formatTime(totalVA)}. Ratio de valor añadido: ${vaRatio.toFixed(4)}%.`);
  }
  
  // Finding 2: Where is 80% of lead time
  if (nvaBreakdown.length) {
    let accum = 0;
    const top = [];
    for (const n of nvaBreakdown) {
      top.push(n.name);
      accum += n.pct;
      if (accum >= 75) break;
    }
    html += renderFinding('amber', `El ${accum.toFixed(0)}% del lead time se concentra en: ${top.join(', ')}. Estos son los puntos con mayor potencial de reducción.`);
  }
  
  // Finding 3: Bottlenecks
  if (bottlenecks.length) {
    const bNames = bottlenecks.map(b => `${b.name||'?'} (${b.ctEff.toFixed(2)} seg vs takt ${takt.toFixed(2)} seg)`);
    html += renderFinding('red', `Cuellos de botella detectados: ${bNames.join(', ')}. Estos procesos no pueden seguir el ritmo de la demanda del cliente.`);
  }
  
  // Finding 4: Causal chain (highest C/O → batch → WIP)
  if (sortedCO.length && sortedCO[0].co > 15) {
    html += renderFinding('amber', `${sortedCO[0].name} tiene el changeover más alto (${sortedCO[0].co} min), lo que fuerza lotes grandes, genera sobreproducción y acumula inventario aguas abajo. Candidato prioritario para SMED.`);
  }
  
  // Finding 5: Low uptime
  if (sortedUp.length && sortedUp[0].up < 90) {
    html += renderFinding('amber', `${sortedUp[0].name} tiene el uptime más bajo (${sortedUp[0].up}%), lo que reduce capacidad efectiva y genera paradas no planificadas. Revisar plan de mantenimiento preventivo.`);
  }
  
  html += `</div></div>`;
  
  // ── PRIORITIZED RECOMMENDATIONS ──
  html += `<div style="margin-top:20px;"><div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;">🎯 Recomendaciones priorizadas</div>`;
  html += `<div style="display:flex;flex-direction:column;gap:8px;">`;
  
  let recNum = 1;
  
  // Rec 1: Fix bottleneck
  if (bottlenecks.length) {
    const bn = bottlenecks[0];
    const upBn = parseFloat(bn.uptime);
    const coBn = parseFloat(bn.co);
    let action = '';
    if (upBn && upBn < 90) action = `Mejorar uptime de ${bn.name} (actual ${upBn}%) mediante mantenimiento preventivo y análisis de paradas.`;
    else if (coBn && coBn > 15) action = `Reducir tiempo de cambio en ${bn.name} (actual ${coBn} min) mediante proyecto SMED para recuperar capacidad.`;
    else action = `Analizar y resolver la restricción de capacidad en ${bn.name} (C/T efectivo ${bn.ctEff.toFixed(2)} seg vs takt ${takt.toFixed(2)} seg).`;
    html += renderRec(recNum++, action, 'Primero — sin capacidad en el cuello de botella, cualquier otra mejora acumula más inventario');
  }
  
  // Rec 2: SMED on highest C/O
  if (sortedCO.length && sortedCO[0].co > 15) {
    html += renderRec(recNum++, `Proyecto SMED en ${sortedCO[0].name} para reducir C/O de ${sortedCO[0].co} min. Objetivo: reducir tamaño de lote y bajar WIP entre procesos.`, 'Reducir lotes ataca directamente el inventario en proceso y el lead time');
  }
  
  // Rec 3: Reduce biggest NVA point
  if (nvaBreakdown.length) {
    const top = nvaBreakdown[0];
    html += renderRec(recNum++, `Reducir inventario en ${top.name} (${formatTime(top.seconds)}, ${top.pct.toFixed(1)}% del lead time). Revisar política de aprovisionamiento o lógica de lotes que genera esta acumulación.`, 'El mayor contribuyente al lead time total');
  }
  
  // Rec 4: Implement pull
  html += renderRec(recNum++, `Evolucionar de sistema push (programa semanal a cada proceso) a sistema pull con señales kanban entre procesos, empezando por el cuello de botella aguas abajo.`, 'El flujo de información push genera sobreproducción en cada etapa');
  
  html += `</div></div>`;
  
  el.innerHTML = html;
}

function renderFinding(color, text) {
  const colors = { red: 'var(--red)', amber: 'var(--amber)', green: 'var(--green)' };
  const bgs = { red: 'rgba(226,75,74,0.06)', amber: 'rgba(186,117,23,0.06)', green: 'rgba(29,158,117,0.06)' };
  return `<div style="padding:10px 14px;background:${bgs[color]};border-left:3px solid ${colors[color]};border-radius:0 var(--r-sm) var(--r-sm) 0;">
    <div style="font-size:12px;color:var(--text);line-height:1.5;">${text}</div>
  </div>`;
}

function renderRec(num, text, rationale) {
  return `<div style="padding:12px 14px;background:var(--s2);border:0.5px solid var(--border);border-radius:var(--r-sm);display:flex;gap:12px;align-items:flex-start;">
    <div style="width:24px;height:24px;border-radius:50%;background:rgba(0,173,181,0.15);border:1px solid var(--teal);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--teal-l);flex-shrink:0;">${num}</div>
    <div><div style="font-size:12px;color:var(--text);line-height:1.5;">${text}</div>
    <div style="font-size:10px;color:var(--text3);margin-top:4px;font-style:italic;">↳ ${rationale}</div></div>
  </div>`;
}

// ── VSM CONTEXT FOR DIOP REPORT ──
function getVSMReportContext() {
  if (!currentClient) return '';
  const vsm = vsmData[currentClient.id];
  if (!vsm || !vsm.processes || !vsm.processes.length) return '';
  
  const takt = calcTaktTime(vsm);
  const procs = vsm.processes;
  
  let totalVA = 0;
  procs.forEach(p => { const ct = normalizeCT(p); if (ct) totalVA += ct; });
  
  let totalNVA = 0;
  const mpDays = parseFloat(vsm.inventories.mp);
  if (mpDays) totalNVA += mpDays * 24 * 3600;
  for (let i = 0; i < procs.length - 1; i++) {
    const key = `${i}_${i+1}`;
    const wip = parseFloat(vsm.inventories.between?.[key]);
    const nextCT = normalizeCT(procs[i+1]);
    if (wip && nextCT) totalNVA += wip * nextCT;
  }
  const ptUnits = parseFloat(vsm.inventories.pt);
  const demandDay = parseFloat(vsm.demand.units_per_day);
  if (ptUnits && demandDay) totalNVA += (ptUnits / demandDay) * 24 * 3600;
  
  const leadTime = totalVA + totalNVA;
  const vaRatio = leadTime > 0 ? (totalVA / leadTime) * 100 : 0;
  
  const bottlenecks = procs.filter(p => { const eff = effectiveCT(p); return takt && eff && eff > takt; });
  
  let ctx = '\n=== VALUE STREAM MAP (ANÁLISIS DE FLUJO) ===\n';
  ctx += `Familia de producto mapeada: ${vsm.client_info.name || 'No especificada'}\n`;
  ctx += `Demanda: ${vsm.demand.units_per_day || '?'} uds/día\n`;
  ctx += `Takt Time: ${takt ? takt.toFixed(2) + ' seg/ud' : 'No calculado'}\n`;
  ctx += `Lead Time total: ${formatTime(leadTime)}\n`;
  ctx += `Tiempo de valor añadido: ${formatTime(totalVA)}\n`;
  ctx += `Ratio de valor añadido: ${vaRatio > 0 ? vaRatio.toFixed(4) + '%' : 'No calculado'}\n`;
  ctx += `\nProcesos mapeados:\n`;
  procs.forEach((p, i) => {
    const ct = normalizeCT(p); const eff = effectiveCT(p);
    const isBot = takt && eff && eff > takt;
    ctx += `  ${i+1}. ${p.name||'?'} — C/T: ${ct ? ct.toFixed(2)+'seg' : '?'}, C/O: ${p.co||'?'}min, Uptime: ${p.uptime||'?'}%${isBot ? ' [CUELLO DE BOTELLA]' : ''}\n`;
  });
  if (bottlenecks.length) {
    ctx += `\nCuellos de botella: ${bottlenecks.map(b => b.name||'?').join(', ')}\n`;
  }
  ctx += `Almacén MP: ${vsm.inventories.mp||'?'} días\n`;
  ctx += `Almacén PT: ${vsm.inventories.pt||'?'} uds${demandDay ? ' (' + (ptUnits/demandDay).toFixed(1) + ' días)' : ''}\n`;
  ctx += `Sistema de planificación: ${vsm.planning.type||'?'} — programa ${vsm.planning.frequency||'?'}\n`;
  
  return ctx;
}

function getM2extReportContext() {
  const m2=m2extData[currentClient?.id];
  if(!m2)return '';
  let ctx='\n=== M2 · DIAGNÓSTICO OPERATIVO DE CAMPO ===\n';
  
  // Gemba
  if(m2.gemba){
    const g=m2.gemba;
    if(g.wip_station)ctx+=`Estación con mayor WIP: ${g.wip_station}\n`;
    if(g.wt_visible)ctx+=`WT visible (operario esperando): ${g.wt_visible}\n`;
    if(g.flow_interrupted)ctx+=`Flujo interrumpido: ${g.flow_interrupted}\n`;
    if(g.pt_constraint)ctx+=`PT en constraint: ${g.pt_constraint}\n`;

    if(g.stops_system)ctx+=`Registro de paros: ${g.stops_system}\n`;

  }

  if(m2.losses){
    const cats=[{k:'averia',l:'Averías'},{k:'falta_material',l:'Falta material'},{k:'changeover',l:'Changeover'},{k:'microparos',l:'Microparos'},{k:'velocidad',l:'Velocidad reducida'},{k:'scrap',l:'Scrap'},{k:'retrabajo',l:'Retrabajo'},{k:'arranque',l:'Rejects arranque'}];
    const filled=cats.filter(c=>m2.losses[c.k]);

      ctx+=`\nÁrbol de pérdidas:\n`;
      filled.forEach(c=>{ctx+=`  ${c.l}: ${m2.losses[c.k]}%${m2.losses_eur[c.k]?' ('+m2.losses_eur[c.k]+' €/año)':''} [Obs: ${m2.losses_level[c.k]||'?'}]\n`;});
    }

  // 5S
  if(m2.fiveS){
    const dims=['seiri','seiton','seiso','seiketsu','shitsuke'];
    const vals=dims.map(k=>parseInt(m2.fiveS[k])||0).filter(v=>v>0);
    if(vals.length){
      const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
      ctx+=`\nScore 5S: ${avg.toFixed(1)}/5\n`;
      dims.forEach(k=>{const v=parseInt(m2.fiveS[k]);if(v)ctx+=`  ${k}: ${v}/5\n`;});
      if(m2.fiveS.notes)ctx+=`  Notas: ${m2.fiveS.notes}\n`;
    }
  }
  
  // Root cause
  if(m2.rootCause){
    const filled=m2.rootCause.filter(r=>r.desc);
    if(filled.length){
      ctx+=`\nAnálisis causa raíz:\n`;
      filled.forEach((r,i)=>{ctx+=`  Pérdida ${i+1}: ${r.desc} · Herramienta: ${r.tool||'?'} · Causa: ${r.cause||'?'} · Confianza: ${r.confidence||'?'} · Iniciativa: ${r.initiative||'?'} (${r.ttl||'?'})\n`;});
    }
  }
  
  // KPI Baseline
  if(m2.kpiBaseline){
    const filled=m2.kpiBaseline.filter(k=>k.value);
    if(filled.length){
      ctx+=`\nKPI Baseline:\n`;
      filled.forEach(k=>{ctx+=`  ${k.name}: ${k.value} ${k.unit} (fuente: ${k.source||'?'}, obs: ${k.obs||'?'})${k.notes?' — '+k.notes:''}\n`;});

      if(obsD>0)ctx+=`  ⚠ ${obsD} KPIs con nivel D (inexistente)\n`;
    }
  }
  return ctx;
}

function getM6ReportContext() {
  const m6=m6Data[currentClient?.id];
  if(!m6||!m6.backlog||!m6.backlog.length)return '';
  let ctx='\n=== M6 · INICIATIVAS Y PRIORIZACIÓN ===\n';
  
  const backlog=m6.backlog;
  ctx+=`Total iniciativas en backlog: ${backlog.length}\n`;
  
  const withROI=backlog.filter(b=>b.investment>0&&b.savings>0);
  if(withROI.length){
    const totalInv=withROI.reduce((a,b)=>a+(b.investment||0),0);
    const totalSav=withROI.reduce((a,b)=>a+(b.savings||0),0);
    ctx+=`Inversión total estimada: ${totalInv}€ · Ahorro anual estimado: ${totalSav}€ · Payback: ${Math.round(totalInv/totalSav*12)} meses\n`;
  }
  
  ctx+=`\nIniciativas priorizadas:\n`;
  backlog.forEach((b,i)=>{
    const zone=b.impact&&b.readiness?getRIMZone(b.impact,b.readiness).zone:'Sin evaluar';
    ctx+=`  ${i+1}. [${b.layer}] ${b.name} — Impacto: ${b.impact||'?'}/10, Readiness: ${b.readiness||'?'}/10, RIM: ${zone}`;
    if(b.investment)ctx+=` · Inv: ${b.investment}€`;
    if(b.savings_low||b.savings||b.savings_high)ctx+=` · Ahorro: ${b.savings_low||'?'}€(conserv) / ${b.savings||'?'}€(base) / ${b.savings_high||'?'}€(optim)/año`;
    if(b.confidence)ctx+=` · Confianza: ${b.confidence}/5`;
    ctx+=`\n`;
  });
  
  return ctx;
}

function getOFIReportContext() {

  ctx+=`OFI: ${ofi}/100 — Zona: ${zone}\n`;

}
